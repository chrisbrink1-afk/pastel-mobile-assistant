name: Rebuild Pastel Payment Assistant v1.11.22 Personal and v2.2 Clean Tutorial

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-v11122-v22-tutorial-portable.yml'
      - 'desktop/v1.11.22_adaptive_tutorial_transform.py'
      - 'desktop/v1.11.22_tutorial_classic_restore_transform.py'
      - 'desktop/v2.2_clean_feedback_transform.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pastel-v11122-v22-tutorial-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and test v1.11.22 Personal source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.22_release.pyw' -Encoding utf8
          $transforms = @(
            'v1.11.1_strict_match_transform.py',
            'v1.11.2_global_match_transform.py',
            'v1.11.3_amount_description_transform.py',
            'v1.11.4_amount_review_transform.py',
            'v1.11.5_sequential_reference_transform.py',
            'v1.11.6_profiles_transform.py',
            'v1.11.7_multi_review_assignment_transform.py',
            'v1.11.8_pre_remove_main_review_method.py',
            'v1.11.8_rule_dialog_review_table_transform.py',
            'v1.11.9_visible_rule_assignment_transform.py',
            'v1.11.10_resizable_rule_dialog_transform.py',
            'v1.11.11_scrollable_rule_dialog_transform.py',
            'v1.11.12_rule_edits_stay_auto_transform.py',
            'v1.11.13_select_manual_allocations_transform.py',
            'v1.11.14_additive_allocation_selection_transform.py',
            'v1.11.15_user_friendly_help_transform.py',
            'v1.11.16_recurring_identity_apply_transform.py',
            'v1.11.17_blank_details_identity_transform.py',
            'v1.11.18_receipt_bank_sign_transform.py',
            'v1.11.19_autosave_session_transform.py',
            'v1.11.20_recurring_payee_identity_transform.py',
            'v1.11.21_modern_classic_ui_transform.py',
            'v1.11.22_adaptive_tutorial_transform.py',
            'v1.11.22_tutorial_classic_restore_transform.py'
          )
          foreach($t in $transforms){
            python (Join-Path 'desktop' $t) 'desktop\v1.11.22_release.pyw'
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }
          python -m py_compile 'desktop\v1.11.22_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.22 compile failed'}
          python 'desktop\v1.11.22_release.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'v1.11.22 self-test failed'}
          $src=Get-Content 'desktop\v1.11.22_release.pyw' -Raw
          $required = @(
            'APP_VERSION = "1.11.22"',
            'TUTORIAL_SETTING_KEY = "__tutorial_v2_state"',
            'def adaptive_tutorial_topic_ids',
            'def search_tutorial_topics',
            'def should_auto_start_tutorial',
            'def start_tutorial(self, auto: bool = False):',
            'def _tutorial_rescan(self):',
            'Search help',
            'Skip tutorial',
            'Tutorial & Help',
            'Re-scan my progress',
            'Why is a transaction orange?',
            'Receipt Bank Amount is negative in Pastel',
            'DEFAULT_UI_MODE = "modern"',
            'UI_MODES = {"modern", "classic"}',
            'APP_DATA_NAMESPACE = "PastelPaymentAssistant"',
            'ALLOW_BUNDLED_RULE_BOOTSTRAP = True',
            'signed_gross = -gross if direction == "RECEIPT" else gross',
            'canonical and p == canonical',
            'def recurring_identity_key',
            'MARY HARTSLIEF',
            'Existing manual selections were preserved',
            'Existing automatic selections were preserved',
            'SESSION_SETTING_KEY = "__autosaved_session_v1"',
            'GLOBAL SAFETY GATE'
          )
          foreach($marker in $required){ if(!$src.Contains($marker)){ throw "Missing Personal source marker: $marker" } }

      - name: Prepare and test v2.2 Clean source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item 'desktop\v1.11.22_release.pyw' 'desktop\v2.2_clean_release.pyw' -Force
          python 'desktop\v2.2_clean_feedback_transform.py' 'desktop\v2.2_clean_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v2.2 clean transform failed'}
          python -m py_compile 'desktop\v2.2_clean_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v2.2 compile failed'}
          python 'desktop\v2.2_clean_release.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'v2.2 self-test failed'}
          $src=Get-Content 'desktop\v2.2_clean_release.pyw' -Raw
          $required = @(
            'APP_VERSION = "2.2"',
            'APP_DATA_NAMESPACE = "PastelPaymentAssistantV2Feedback"',
            'APP_DATA_FALLBACK = ".pastel_payment_assistant_v2_feedback"',
            'CLEAN_FEEDBACK_BUILD = True',
            'ALLOW_BUNDLED_RULE_BOOTSTRAP = False',
            'TUTORIAL_SETTING_KEY = "__tutorial_v2_state"',
            'def adaptive_tutorial_topic_ids',
            'def search_tutorial_topics',
            'Tutorial & Help',
            'Clean feedback workspace',
            'signed_gross = -gross if direction == "RECEIPT" else gross',
            'def recurring_identity_key',
            'GLOBAL SAFETY GATE'
          )
          foreach($marker in $required){ if(!$src.Contains($marker)){ throw "Missing Clean source marker: $marker" } }

      - name: Exercise Modern, Classic and tutorial UI on Windows
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $py = @'
          import importlib.machinery
          import importlib.util
          import os
          import tempfile
          from pathlib import Path

          def load_module(path, name, appdata):
              os.environ['APPDATA'] = str(appdata)
              loader = importlib.machinery.SourceFileLoader(name, path)
              spec = importlib.util.spec_from_loader(name, loader)
              mod = importlib.util.module_from_spec(spec)
              loader.exec_module(mod)
              return mod

          def exercise(path, name, expect_clean):
              with tempfile.TemporaryDirectory() as td:
                  mod = load_module(path, name, Path(td))
                  app = mod.App()
                  app.withdraw()
                  app.update_idletasks()
                  assert app.ui_mode == 'modern'
                  assert mod.should_auto_start_tutorial(app.store) is True
                  snap = mod.tutorial_workspace_snapshot(app.store, app.txns, app.receipts)
                  assert snap['loaded'] is False
                  assert 'load' in mod.adaptive_tutorial_topic_ids(snap)
                  assert mod.search_tutorial_topics('orange transaction')[0]['id'] == 'orange'
                  assert mod.search_tutorial_topics('receipt negative')[0]['id'] == 'receipt_sign'
                  app.start_tutorial(auto=False)
                  app.update_idletasks()
                  assert app.tutorial_window.winfo_exists()
                  assert app.tutorial_list.size() > 5
                  app.tutorial_search_var.set('wrong gl')
                  app._tutorial_search(); app.update_idletasks()
                  assert app.tutorial_title_var.get() == 'An automatic allocation used the wrong GL'
                  app._tutorial_clear_search(); app.update_idletasks()
                  app._tutorial_rescan(); app.update_idletasks()
                  app._tutorial_close(); app.update_idletasks()
                  app._apply_ui_mode('classic'); app.update_idletasks()
                  assert app.ui_mode == 'classic'
                  app.start_tutorial(auto=False); app.update_idletasks()
                  assert app.ui_mode == 'modern'
                  app._tutorial_close(); app.update_idletasks()
                  assert app.ui_mode == 'classic'
                  app._tutorial_record_state('skipped')
                  assert mod.should_auto_start_tutorial(app.store) is False
                  app._apply_ui_mode('modern'); app.update_idletasks()
                  app._navigate_modern('dashboard'); app.update_idletasks()
                  app._navigate_modern('payments'); app.update_idletasks()
                  app._navigate_modern('receipts'); app.update_idletasks()
                  app._navigate_modern('rules'); app.update_idletasks()
                  app._navigate_modern('settings'); app.update_idletasks()
                  assert app._save_session() is True
                  if expect_clean:
                      assert mod.APP_DATA_NAMESPACE == 'PastelPaymentAssistantV2Feedback'
                      assert mod.ALLOW_BUNDLED_RULE_BOOTSTRAP is False
                  else:
                      assert mod.APP_DATA_NAMESPACE == 'PastelPaymentAssistant'
                      assert mod.ALLOW_BUNDLED_RULE_BOOTSTRAP is True
                  app.destroy()

          exercise(r'desktop\v1.11.22_release.pyw', 'tutorial_personal', False)
          exercise(r'desktop\v2.2_clean_release.pyw', 'tutorial_clean', True)
          print('Adaptive searchable tutorial Windows UI smoke test passed')
          '@
          $py | Set-Content 'desktop\v11122_v22_tutorial_smoke.py'
          python 'desktop\v11122_v22_tutorial_smoke.py'
          if($LASTEXITCODE -ne 0){throw 'Tutorial Windows UI smoke failed'}

      - name: Build portable Windows apps
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller install failed'}

          Remove-Item 'desktop\v11122build' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\v22build' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'desktop\v11122build' | Out-Null
          New-Item -ItemType Directory -Force 'desktop\v22build' | Out-Null

          Copy-Item 'desktop\v1.11.22_release.pyw' 'desktop\v11122build\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v11122build'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.22 Personal" pastel_payment_assistant.pyw
          $personalCode=$LASTEXITCODE
          Pop-Location
          if($personalCode -ne 0){throw 'v1.11.22 Personal PyInstaller build failed'}
          Copy-Item 'desktop\v11122build\dist\Pastel Payment Assistant v1.11.22 Personal' 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.22 Personal - Portable Windows',
            '',
            'No Python installation is required. Keep the entire folder together.',
            'Run: Pastel Payment Assistant v1.11.22 Personal.exe',
            '',
            'Tutorial & Help:',
            '- Genuinely new/empty users receive an automatic guided tutorial.',
            '- Existing Personal users with established work are not interrupted.',
            '- Skip, Back, Next and Finish are available.',
            '- The tutorial scans the current profile/statement and shortens or changes the recommended path based on work already completed.',
            '- Re-scan my progress updates the tutorial while it is open.',
            '- Searchable help accepts problem terms such as orange transaction, wrong GL, VAT, recurring missing, receipt negative, export and autosave.',
            '- Tutorial & Help is always available in Modern sidebar and Classic toolbar.',
            '',
            'UI and compatibility:',
            '- Modern accounting-dashboard UI remains the default.',
            '- Classic previous layout remains available and uses exactly the same data.',
            '- Launching the tutorial from Classic temporarily uses Modern guidance and returns to Classic when the tutorial closes.',
            '- Uses the existing PastelPaymentAssistant AppData location and preserves previous Personal profiles/rules/settings/history/session.',
            '- Receipt positive-bank-amount, STOP ORDER blank-description, Mary Hartslief recurrence, additive selection and strict matching fixes remain included.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable\README.txt'

          Copy-Item 'desktop\v2.2_clean_release.pyw' 'desktop\v22build\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v22build'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v2.2 Clean" pastel_payment_assistant.pyw
          $cleanCode=$LASTEXITCODE
          Pop-Location
          if($cleanCode -ne 0){throw 'v2.2 Clean PyInstaller build failed'}
          Copy-Item 'desktop\v22build\dist\Pastel Payment Assistant v2.2 Clean' 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable' -Recurse
          @(
            'Pastel Payment Assistant v2.2 Clean - Portable Windows Feedback Build',
            '',
            'No Python installation is required. Keep the entire folder together.',
            'Run: Pastel Payment Assistant v2.2 Clean.exe',
            '',
            'Tutorial & Help:',
            '- Opens automatically in a genuinely new Clean workspace.',
            '- Can be skipped and rerun at any time.',
            '- Adapts to the current profile/statement progress.',
            '- Includes searchable problem/question help and direct navigation to the relevant app page.',
            '',
            'Clean/shareable behavior:',
            '- Contains no personal rules, settings, transaction history, company profiles or saved session.',
            '- Uses isolated PastelPaymentAssistantV2Feedback AppData.',
            '- Does not read or modify a Personal installation.',
            '- Modern and Classic UI are both included.',
            '- Same accounting fixes and validation logic as Personal.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable\README.txt'

          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable.zip' -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable.zip' -Force -ErrorAction SilentlyContinue
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable.zip' -Force
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable' 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable.zip' -Force
          $personalHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          $cleanHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$personalHash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable.sha256.txt'
          "SHA256=$cleanHash" | Set-Content 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable.zip').Length -ge 100MB){throw 'Personal ZIP too large'}
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable.zip').Length -ge 100MB){throw 'Clean ZIP too large'}

      - name: Publish successful packages
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $personalHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          $cleanHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.22 Personal and v2.2 Clean packages succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "v1.11.22 Personal ZIP SHA256: $personalHash",
            "v2.2 Clean ZIP SHA256: $cleanHash",
            'Packaging: PyInstaller --onedir --windowed',
            'Adaptive tutorial curriculum check: passed',
            'New-user automatic tutorial check: passed',
            'Existing-work tutorial suppression logic check: passed',
            'Tutorial Skip/Back/Next/Finish UI check: passed',
            'Tutorial Re-scan current progress check: passed',
            'Searchable tutorial help checks: passed',
            'Orange transaction search check: passed',
            'Wrong GL search check: passed',
            'Receipt negative search check: passed',
            'Classic -> tutorial -> Classic restore check: passed',
            'Modern dashboard and sidebar navigation smoke check: passed',
            'Classic previous-layout compatibility check: passed',
            'Personal existing AppData compatibility check: passed',
            'v2.2 Clean isolated AppData namespace check: passed',
            'Receipt positive Pastel Bank Amount checks: passed',
            'Blank-description STOP ORDER HANDLING FEE checks: passed',
            'Mary Hartslief recurring identity checks: passed',
            'Auto and Manual additive selection checks: passed',
            'Resizable and scrollable Rule dialog checks: passed',
            'Company profile isolation tests: passed',
            'Monthly sequential reference tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.22_AND_V2.2_SUCCESS.txt'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -f 'desktop/Pastel-Payment-Assistant-v1.11.22-Personal-Portable.zip'
          git add -f 'desktop/Pastel-Payment-Assistant-v1.11.22-Personal-Portable.sha256.txt'
          git add -f 'desktop/Pastel-Payment-Assistant-v2.2-Clean-Portable.zip'
          git add -f 'desktop/Pastel-Payment-Assistant-v2.2-Clean-Portable.sha256.txt'
          git add -f 'desktop/BUILD_DESKTOP_V1.11.22_AND_V2.2_SUCCESS.txt'
          git rm '.github/workflows/rebuild-v11122-v22-tutorial-portable.yml'
          git commit -m 'Publish Pastel Payment Assistant v1.11.22 Personal and v2.2 Clean tutorial [skip ci]'
          git push origin main
