          'AUTOLEDGER Free v2.2.5 R10.2 COMPLETE SOURCE - exact effective source used for this validated build.' | Set-Content -Encoding UTF8 'autoledger-r10-2\source-release\free\README_SOURCE.txt'
          'AUTOLEDGER Pro v2.2.5 R10.2 COMPLETE SOURCE - exact effective source used for this validated build. Permanent private ALP225R6 signing material is intentionally excluded and remains only in the private KeyGen source.' | Set-Content -Encoding UTF8 'autoledger-r10-2\source-release\pro\README_SOURCE.txt'

