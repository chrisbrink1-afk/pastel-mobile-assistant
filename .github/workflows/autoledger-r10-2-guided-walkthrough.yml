name: AUTOLEDGER R10.2 True Guided Walkthrough Windows Build

on:
  push:
    branches:
      - autoledger-r10-2-guided-walkthrough
    paths:
      - '.github/workflows/autoledger-r10-2-guided-walkthrough.yml'
      - 'autoledger-r10-2/**'
      - 'autoledger-r10-1/**'
      - 'autoledger-r10/**'
      - 'autoledger-r9/**'
      - 'autoledger-r8/**'
      - 'activation-service/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate activation service logic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location 'activation-service'
          node test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Activation-service tests failed' }
          Pop-Location

      - name: Reconstruct and validate original v2.2 Clean source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python desktop/tutorial_ci_diagnostic.py
          if ($LASTEXITCODE -ne 0) { throw 'Original v2.2 reconstruction/regression suite failed' }
          if (!(Test-Path 'desktop\diag_v22_clean.pyw')) { throw 'Reconstructed source was not produced' }

      - name: Validate permanent R6 entitlement compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location 'autoledger-r8'
          python test_licensing_vectors.py
          if ($LASTEXITCODE -ne 0) { throw 'Permanent R6 entitlement compatibility test failed' }
          Pop-Location

      - name: Prepare R10.2 Free and Pro source trees
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --quiet pillow
          python autoledger-r8/generate_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Asset generation failed' }

          Remove-Item 'autoledger-r10-2\work' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'autoledger-r10-2\work\free\assets' | Out-Null
          New-Item -ItemType Directory -Force 'autoledger-r10-2\work\pro\assets' | Out-Null

          Copy-Item 'desktop\diag_v22_clean.pyw' 'autoledger-r10-2\work\free\autoledger_core.py' -Force
          Copy-Item 'desktop\diag_v22_clean.pyw' 'autoledger-r10-2\work\pro\autoledger_core.py' -Force
          python 'autoledger-r8\r8_core_transform.py' 'autoledger-r10-2\work\free\autoledger_core.py'
          python 'autoledger-r8\r8_core_transform.py' 'autoledger-r10-2\work\pro\autoledger_core.py'

          Copy-Item 'autoledger-r8\autoledger_common.py' 'autoledger-r10-2\work\free\autoledger_common.py' -Force
          Copy-Item 'autoledger-r8\autoledger_common.py' 'autoledger-r10-2\work\pro\autoledger_common.py' -Force
          python 'autoledger-r10\r10_common_transform.py' 'autoledger-r10-2\work\free\autoledger_common.py'
          python 'autoledger-r10\r10_common_transform.py' 'autoledger-r10-2\work\pro\autoledger_common.py'

          Copy-Item 'autoledger-r9\help_topics.py' 'autoledger-r10-2\work\free\help_topics.py' -Force
          Copy-Item 'autoledger-r9\help_topics.py' 'autoledger-r10-2\work\pro\help_topics.py' -Force
          Copy-Item 'autoledger-r10\guided_tutorial.py' 'autoledger-r10-2\work\free\guided_tutorial.py' -Force
          Copy-Item 'autoledger-r10\guided_tutorial.py' 'autoledger-r10-2\work\pro\guided_tutorial.py' -Force
          Copy-Item 'autoledger-r10-1\tutorial_render_fix.py' 'autoledger-r10-2\work\free\tutorial_render_fix.py' -Force
          Copy-Item 'autoledger-r10-1\tutorial_render_fix.py' 'autoledger-r10-2\work\pro\tutorial_render_fix.py' -Force
          Copy-Item 'autoledger-r10-2\guided_walkthrough_r102.py' 'autoledger-r10-2\work\free\guided_walkthrough_r102.py' -Force
          Copy-Item 'autoledger-r10-2\guided_walkthrough_r102.py' 'autoledger-r10-2\work\pro\guided_walkthrough_r102.py' -Force

          Copy-Item 'autoledger-r8\free_runner.pyw' 'autoledger-r10-2\work\free\free_runner.pyw' -Force
          Copy-Item 'autoledger-r8\pro_runner.pyw' 'autoledger-r10-2\work\pro\pro_runner.pyw' -Force
          Copy-Item 'autoledger-r8\license_crypto.py' 'autoledger-r10-2\work\pro\license_crypto.py' -Force
          Copy-Item 'autoledger-r8\activation_crypto.py' 'autoledger-r10-2\work\pro\activation_crypto.py' -Force
          Copy-Item 'autoledger-r8\device_identity.py' 'autoledger-r10-2\work\pro\device_identity.py' -Force
          Copy-Item 'autoledger-r8\pro_licensing.py' 'autoledger-r10-2\work\pro\pro_licensing.py' -Force
          Copy-Item 'autoledger-r8\assets\*' 'autoledger-r10-2\work\free\assets' -Force
          Copy-Item 'autoledger-r8\assets\*' 'autoledger-r10-2\work\pro\assets' -Force

          python 'autoledger-r10-1\r10_1_common_transform.py' 'autoledger-r10-2\work\free\autoledger_common.py'
          python 'autoledger-r10-1\r10_1_common_transform.py' 'autoledger-r10-2\work\pro\autoledger_common.py'
          python 'autoledger-r10-2\r10_2_common_transform.py' 'autoledger-r10-2\work\free\autoledger_common.py'
          python 'autoledger-r10-2\r10_2_common_transform.py' 'autoledger-r10-2\work\pro\autoledger_common.py'

          Copy-Item 'autoledger-r8\EULA.txt' 'autoledger-r10-2\EULA.txt' -Force
          New-Item -ItemType Directory -Force 'autoledger-r10-2\assets' | Out-Null
          Copy-Item 'autoledger-r8\assets\*' 'autoledger-r10-2\assets' -Force

          Get-ChildItem 'autoledger-r10-2\work\free' -File | Where-Object { $_.Extension -in @('.py','.pyw') } | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Compile failed: $($_.FullName)" } }
          Get-ChildItem 'autoledger-r10-2\work\pro' -File | Where-Object { $_.Extension -in @('.py','.pyw') } | ForEach-Object { python -m py_compile $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Compile failed: $($_.FullName)" } }

      - name: Prove R10.2 is a real guided walkthrough
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'r102-walkthrough-appdata'
          Remove-Item $env:APPDATA -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          Push-Location 'autoledger-r10-2\work\free'
          @'
          import time
          import autoledger_common as common
          common.configure('FREE')
          import autoledger_core as core
          app = core.App()
          try:
              app.withdraw()
              app.update_idletasks()
              assert common.UPDATE_REVISION == 'R10.2'

              # UPDATE: NEW IN THIS UPDATE must be first and all navigation must
              # physically fit inside the tutorial window.
              snap = app._r102_walkthrough_smoke('update')
              print('UPDATE walkthrough:', snap)
              assert snap['title'] == 'NEW IN THIS UPDATE', snap
              assert snap['step_id'] == 'update_intro', snap
              assert snap['next']['text'] == 'Next' and snap['next']['state'] != 'disabled', snap
              assert snap['back']['text'] == 'Back' and snap['back']['state'] == 'disabled', snap
              assert snap['skip']['text'] == 'Skip Tutorial', snap
              assert all(snap[k]['mapped'] and snap[k]['onscreen'] for k in ('back','next','skip')), snap

              before = snap['index']
              app._r10_guided_next.invoke(); app.update()
              moved = app._r102_walkthrough_snapshot()
              assert moved['index'] == before + 1, moved
              app._r10_guided_back.invoke(); app.update()
              back = app._r102_walkthrough_snapshot()
              assert back['index'] == before, back
              app._r10_close_guided()

              # CLEAN INSTALL: never pretend this is an update.
              clean = app._r102_walkthrough_smoke('clean')
              print('CLEAN walkthrough:', clean)
              assert clean['step_id'] == 'welcome', clean
              assert clean['title'] != 'NEW IN THIS UPDATE', clean
              assert all(clean[k]['mapped'] and clean[k]['onscreen'] for k in ('back','next','skip')), clean

              # Welcome is explanatory, so Next works. Profile is action-gated.
              app._r10_guided_next.invoke(); app.update()
              profile = app._r102_walkthrough_snapshot()
              assert profile['step_id'] == 'profile', profile
              assert profile['next']['state'] == 'disabled', profile
              time.sleep(0.2); app.update()
              assert app._r102_find_target(('Rename','New')) is not None

              app.profile_manager.rename_profile(app.active_profile_id, 'Tutorial Test Company')
              app._refresh_profile_ui(); app.update()
              deadline = time.time() + 1.5
              while time.time() < deadline and app._r102_walkthrough_snapshot()['next']['state'] == 'disabled':
                  app.update(); time.sleep(0.03)
              unlocked = app._r102_walkthrough_snapshot()
              assert unlocked['next']['state'] != 'disabled', unlocked

              ids = app._r102_step_ids('clean')
              required_rule_steps = ['rule_open','rule_name','rule_match','rule_method','rule_gl','rule_vat','rule_priority','rule_amount_optional','rule_save']
              for step in required_rule_steps:
                  assert step in ids, (step, ids)
              assert ids.index('rule_open') < ids.index('rule_name') < ids.index('rule_save')

              # Skip must actually close the walkthrough.
              app._r102_skip_button.invoke(); app.update()
              assert getattr(app, '_r10_guided_window', None) is None
          finally:
              try: app._r10_close_guided()
              except Exception: pass
              app.destroy()
          '@ | Set-Content -Encoding UTF8 r102_walkthrough_test.py
          python r102_walkthrough_test.py
          if ($LASTEXITCODE -ne 0) { throw 'R10.2 guided-walkthrough acceptance test failed' }
          Pop-Location

      - name: Audit UI and complete beginner Help coverage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'autoledger-r10-2\audit-output' -Recurse -Force -ErrorAction SilentlyContinue
          python 'autoledger-r9\help_inventory.py' 'autoledger-r10-2\work\free\autoledger_core.py' 'autoledger-r10-2\audit-output'
          Push-Location 'autoledger-r9'
          python help_coverage_test.py '..\autoledger-r10-2\audit-output\ui_feature_inventory.json'
          if ($LASTEXITCODE -ne 0) { throw 'Complete-help coverage test failed' }
          Pop-Location

      - name: Build self-contained R10.2 Windows applications
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          Push-Location 'autoledger-r10-2\work\free'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --icon 'assets\AUTOLEDGER_ICON.ico' --add-data 'assets;assets' --name 'AUTOLEDGER Free v2.2.5 R10.2 TEST' free_runner.pyw
          if ($LASTEXITCODE -ne 0) { throw 'Free R10.2 build failed' }
          Pop-Location
          Push-Location 'autoledger-r10-2\work\pro'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --icon 'assets\AUTOLEDGER_ICON.ico' --add-data 'assets;assets' --name 'AUTOLEDGER Pro v2.2.5 R10.2 TEST' pro_runner.pyw
          if ($LASTEXITCODE -ne 0) { throw 'Pro R10.2 build failed' }
          Pop-Location

      - name: Smoke-test bundled R10.2 applications
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'r102-bundled-smoke'
          Remove-Item $env:APPDATA -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $free = Resolve-Path 'autoledger-r10-2\work\free\dist\AUTOLEDGER Free v2.2.5 R10.2 TEST\AUTOLEDGER Free v2.2.5 R10.2 TEST.exe'
          $pro = Resolve-Path 'autoledger-r10-2\work\pro\dist\AUTOLEDGER Pro v2.2.5 R10.2 TEST\AUTOLEDGER Pro v2.2.5 R10.2 TEST.exe'
          $p = Start-Process -FilePath $free -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Free R10.2 smoke failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath $pro -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Pro R10.2 smoke failed: $($p.ExitCode)" }

      - name: Build four R10.2 installers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 not found' }
          Remove-Item 'autoledger-r10-2\package' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'autoledger-r10-2\output' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'autoledger-r10-2\package\free' | Out-Null
          New-Item -ItemType Directory -Force 'autoledger-r10-2\package\pro' | Out-Null
          New-Item -ItemType Directory -Force 'autoledger-r10-2\output' | Out-Null
          Copy-Item 'autoledger-r10-2\work\free\dist\AUTOLEDGER Free v2.2.5 R10.2 TEST\*' 'autoledger-r10-2\package\free' -Recurse -Force
          Copy-Item 'autoledger-r10-2\work\pro\dist\AUTOLEDGER Pro v2.2.5 R10.2 TEST\*' 'autoledger-r10-2\package\pro' -Recurse -Force
          Push-Location 'autoledger-r10-2'
          foreach ($iss in @('free_update.iss','free_full.iss','pro_update.iss','pro_full.iss')) {
            & $iscc $iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $iss" }
          }
          Pop-Location

      - name: Prove R10.2 Update recognises every older release and refuses a clean PC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($script in @('autoledger-r10-2\free_update.iss','autoledger-r10-2\pro_update.iss')) {
            $txt = Get-Content $script -Raw
            foreach ($rev in @('R6','R8','R9','R10','R10.1')) {
              if ($txt -notmatch [regex]::Escape($rev)) { throw "$script does not recognise older $rev installations" }
            }
          }
          Remove-Item (Join-Path $env:LOCALAPPDATA 'Programs\AUTOLEDGER Free') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:LOCALAPPDATA 'Programs\AUTOLEDGER Pro') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:APPDATA 'AUTOLEDGER_V225_TEST_Free') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:APPDATA 'AUTOLEDGER_V225_TEST_Pro') -Recurse -Force -ErrorAction SilentlyContinue
          $update = Resolve-Path 'autoledger-r10-2\output\AUTOLEDGER_Free_v2.2.5_R10_2_UPDATE_from_OLDER_TEST_Setup.exe'
          $p = Start-Process -FilePath $update -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -eq 0) { throw 'R10.2 Update unexpectedly installed on a clean PC' }

      - name: Install R10.2 Update over seeded R10.1 and preserve data/licence/tutorial history
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $freeDir = Join-Path $env:LOCALAPPDATA 'Programs\AUTOLEDGER Free'
          $proDir = Join-Path $env:LOCALAPPDATA 'Programs\AUTOLEDGER Pro'
          $freeData = Join-Path $env:APPDATA 'AUTOLEDGER_V225_TEST_Free'
          $proData = Join-Path $env:APPDATA 'AUTOLEDGER_V225_TEST_Pro'
          foreach ($p in @($freeDir,$proDir,$freeData,$proData)) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory -Force $p | Out-Null }
          New-Item -ItemType File -Force (Join-Path $freeDir 'AUTOLEDGER Free v2.2.5 R10.1 TEST.exe') | Out-Null
          New-Item -ItemType File -Force (Join-Path $proDir 'AUTOLEDGER Pro v2.2.5 R10.1 TEST.exe') | Out-Null
          '{"version":1,"months":{"2026-08":{"used":37,"statements":{"seed":{"entries":37}}}}}' | Set-Content -Encoding UTF8 (Join-Path $freeData 'free_usage_r6.json')
          '{"version":1,"last_prompted_revision":"R10.1","last_outcome":"completed","last_mode":"update"}' | Set-Content -Encoding UTF8 (Join-Path $freeData 'guided_tutorial_state.json')
          '{"version":1,"last_prompted_revision":"R10.1","last_outcome":"completed","last_mode":"update"}' | Set-Content -Encoding UTF8 (Join-Path $proData 'guided_tutorial_state.json')

          $sample = (Get-Content 'autoledger-r8\testdata\R6_SAMPLE_ENTITLEMENT_KEY.txt' -Raw).Trim()
          Push-Location 'autoledger-r10-2\work\pro'
          python -c "import json,sys; from license_crypto import decode_and_verify_key; k=sys.argv[1]; p=decode_and_verify_key(k); open(sys.argv[2],'w',encoding='utf-8').write(json.dumps({'version':1,'key':k,'payload':p},indent=2))" $sample (Join-Path $proData 'pro_licence_r6.json')
          if ($LASTEXITCODE -ne 0) { throw 'Could not seed permanent Pro entitlement' }
          Pop-Location

          $freeHashBefore = (Get-FileHash (Join-Path $freeData 'free_usage_r6.json') -Algorithm SHA256).Hash
          $proHashBefore = (Get-FileHash (Join-Path $proData 'pro_licence_r6.json') -Algorithm SHA256).Hash
          $fu = Resolve-Path 'autoledger-r10-2\output\AUTOLEDGER_Free_v2.2.5_R10_2_UPDATE_from_OLDER_TEST_Setup.exe'
          $pu = Resolve-Path 'autoledger-r10-2\output\AUTOLEDGER_Pro_v2.2.5_R10_2_UPDATE_from_OLDER_TEST_Setup.exe'
          $p = Start-Process -FilePath $fu -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Free R10.2 update failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath $pu -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Pro R10.2 update failed: $($p.ExitCode)" }

          $freeContext = Get-Content (Join-Path $freeData 'install_context_r10.json') -Raw | ConvertFrom-Json
          $proContext = Get-Content (Join-Path $proData 'install_context_r10.json') -Raw | ConvertFrom-Json
          if ($freeContext.revision -ne 'R10.2' -or $freeContext.install_kind -ne 'update') { throw 'Free update tutorial marker wrong' }
          if ($proContext.revision -ne 'R10.2' -or $proContext.install_kind -ne 'update') { throw 'Pro update tutorial marker wrong' }
          if ((Get-FileHash (Join-Path $freeData 'free_usage_r6.json') -Algorithm SHA256).Hash -ne $freeHashBefore) { throw 'Free usage state changed during update' }
          if ((Get-FileHash (Join-Path $proData 'pro_licence_r6.json') -Algorithm SHA256).Hash -ne $proHashBefore) { throw 'Pro entitlement changed during update' }

          $freeExe = Join-Path $freeDir 'AUTOLEDGER Free v2.2.5 R10.2 TEST.exe'
          $proExe = Join-Path $proDir 'AUTOLEDGER Pro v2.2.5 R10.2 TEST.exe'
          if (!(Test-Path $freeExe) -or !(Test-Path $proExe)) { throw 'R10.2 update executable missing' }
          if (Test-Path (Join-Path $freeDir 'AUTOLEDGER Free v2.2.5 R10.1 TEST.exe')) { throw 'Old Free R10.1 executable was not retired' }
          if (Test-Path (Join-Path $proDir 'AUTOLEDGER Pro v2.2.5 R10.1 TEST.exe')) { throw 'Old Pro R10.1 executable was not retired' }

          $p = Start-Process -FilePath $freeExe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installed Free R10.2 smoke failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath $proExe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installed Pro R10.2 smoke failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath $proExe -ArgumentList '--existing-licence-smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Existing permanent Pro entitlement was not accepted after R10.2 update' }

      - name: Validate clean Full installations use beginner walkthrough, not NEW IN THIS UPDATE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $freeDir = Join-Path $env:LOCALAPPDATA 'Programs\AUTOLEDGER Free'
          $proDir = Join-Path $env:LOCALAPPDATA 'Programs\AUTOLEDGER Pro'
          $freeData = Join-Path $env:APPDATA 'AUTOLEDGER_V225_TEST_Free'
          $proData = Join-Path $env:APPDATA 'AUTOLEDGER_V225_TEST_Pro'
          foreach ($p in @($freeDir,$proDir,$freeData,$proData)) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          $ff = Resolve-Path 'autoledger-r10-2\output\AUTOLEDGER_Free_v2.2.5_R10_2_FULL_STANDALONE_TEST_Setup.exe'
          $pf = Resolve-Path 'autoledger-r10-2\output\AUTOLEDGER_Pro_v2.2.5_R10_2_FULL_STANDALONE_TEST_Setup.exe'
          $p = Start-Process -FilePath $ff -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Free R10.2 full install failed' }
          $p = Start-Process -FilePath $pf -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Pro R10.2 full install failed' }
          $freeContext = Get-Content (Join-Path $freeData 'install_context_r10.json') -Raw | ConvertFrom-Json
          $proContext = Get-Content (Join-Path $proData 'install_context_r10.json') -Raw | ConvertFrom-Json
          if ($freeContext.revision -ne 'R10.2' -or $freeContext.install_kind -ne 'clean') { throw 'Free Full wrote wrong tutorial context' }
          if ($proContext.revision -ne 'R10.2' -or $proContext.install_kind -ne 'clean') { throw 'Pro Full wrote wrong tutorial context' }

      - name: Build verified complete R10.2 Free and Pro source packages
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'autoledger-r10-2\source-release' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'autoledger-r10-2\source-release\free\application\assets' | Out-Null
          New-Item -ItemType Directory -Force 'autoledger-r10-2\source-release\free\build' | Out-Null
          New-Item -ItemType Directory -Force 'autoledger-r10-2\source-release\pro\application\assets' | Out-Null
          New-Item -ItemType Directory -Force 'autoledger-r10-2\source-release\pro\build' | Out-Null

          Get-ChildItem 'autoledger-r10-2\work\free' -File | Where-Object { $_.Extension -in @('.py','.pyw') } | Copy-Item -Destination 'autoledger-r10-2\source-release\free\application' -Force
          Copy-Item 'autoledger-r10-2\work\free\assets\*' 'autoledger-r10-2\source-release\free\application\assets' -Force
          Copy-Item 'autoledger-r10-2\EULA.txt' 'autoledger-r10-2\source-release\free\EULA.txt' -Force
          Copy-Item 'autoledger-r10-2\free_update.iss' 'autoledger-r10-2\source-release\free\build' -Force
          Copy-Item 'autoledger-r10-2\free_full.iss' 'autoledger-r10-2\source-release\free\build' -Force
          Copy-Item 'autoledger-r10\r10_common_transform.py' 'autoledger-r10-2\source-release\free\build' -Force
          Copy-Item 'autoledger-r10-1\r10_1_common_transform.py' 'autoledger-r10-2\source-release\free\build' -Force
