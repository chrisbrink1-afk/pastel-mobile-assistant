      - name: Prepare hashes and release README
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          AUTOLEDGER v2.2.5 R10.2 TEST — TRUE GUIDED WALKTHROUGH

          R10.2 corrects the R10/R10.1 tutorial design so it behaves as an interactive guided walkthrough rather than a slide-like information window.
          Back, Next and Skip Tutorial remain visibly fixed on screen. Required steps lock Next until the user completes the real action in AUTOLEDGER.
          The walkthrough points to real controls and teaches Saved Rule setup field by field.
          Clean install: beginner Welcome first; never NEW IN THIS UPDATE.
          Update: NEW IN THIS UPDATE first, then the guided workflow.
          Existing AppData, Free usage and permanent ALP225R6 Pro entitlement are preserved.
          These TEST builds remain unsigned pending the AUTOLEDGER SYSTEMS PTY LTD code-signing certificate.
          '@ | Set-Content -Encoding UTF8 'autoledger-r10-2\output\README_R10_2_TEST.txt'
          Get-ChildItem 'autoledger-r10-2\output' -File | Where-Object { $_.Extension -in @('.exe','.zip') } | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ASCII 'autoledger-r10-2\output\AUTOLEDGER_v2.2.5_R10_2_SHA256.txt'

      - name: Upload validated R10.2 installers and complete source
        uses: actions/upload-artifact@v4
        with:
          name: AUTOLEDGER-v2.2.5-R10.2-TRUE-GUIDED-WALKTHROUGH-WINDOWS-AND-SOURCE
          path: |
            autoledger-r10-2/output/*.exe
            autoledger-r10-2/output/*.zip
            autoledger-r10-2/output/*.txt
            autoledger-r10-2/audit-output/ui_feature_inventory.json
            autoledger-r10-2/audit-output/R9_UI_FEATURE_AUDIT.md
          if-no-files-found: error
          retention-days: 90
