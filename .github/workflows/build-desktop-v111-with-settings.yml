name: Build Pastel Payment Assistant v1.11 With Settings Transfer

on:
  push:
    branches:
      - feature/v1.11-allocation-controls
    paths:
      - '.github/workflows/build-desktop-v111-with-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare final v1.11 source with settings transfer
        id: patch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item 'desktop\v1.11_candidate.pyw' 'desktop\v1.11_final.pyw' -Force
          $src = Get-Content 'desktop\v1.11_final.pyw' -Raw
          if(!$src.Contains('Export settings backup…')){
            python 'desktop\v1.11_settings_transfer_patch.py' 'desktop\v1.11_final.pyw'
            if($LASTEXITCODE -ne 0){throw 'Settings transfer patch failed'}
          }
          if(!(Select-String -Path 'desktop\v1.11_final.pyw' -Pattern 'APP_VERSION = "1.11.0"')){throw 'v1.11 version marker missing'}

      - name: Compile and run app self-tests
        id: test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile 'desktop\v1.11_final.pyw'
          if($LASTEXITCODE -ne 0){throw 'Python source validation failed'}
          python 'desktop\v1.11_final.pyw' --self-test | Tee-Object -FilePath 'desktop\V111_FINAL_SELF_TEST.txt'
          if($LASTEXITCODE -ne 0){throw 'v1.11 self-test failed'}

      - name: Test v1.10 settings database and v1.11 JSON import
        id: transfer_test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json
          import runpy
          import sqlite3
          import tempfile
          from pathlib import Path

          ns = runpy.run_path(r'desktop\v1.11_final.pyw', run_name='v111_settings_test')
          reader = ns['read_settings_transfer']
          expected = {
              'contra_account': '1100000',
              'vat_tax_type': '1',
              'vat_rate': '15',
              'fiscal_start_month': '3',
              'project_code': 'ABC',
          }
          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              db = td / 'pastel_payment_assistant.db'
              conn = sqlite3.connect(db)
              conn.execute('CREATE TABLE settings (key TEXT PRIMARY KEY, value TEXT NOT NULL)')
              conn.executemany('INSERT INTO settings(key,value) VALUES(?,?)', list(expected.items()) + [('last_folder', r'C:\old-pc')])
              conn.commit(); conn.close()
              assert reader(str(db)) == expected

              js = td / 'settings.json'
              js.write_text(json.dumps({'format':'PastelPaymentAssistantSettings','format_version':1,'settings':expected}), encoding='utf-8')
              assert reader(str(js)) == expected
          print('v1.10 DB import and v1.11 JSON settings backup import passed')
          '@ | python - | Tee-Object -FilePath 'desktop\V111_FINAL_SETTINGS_TRANSFER_TEST.txt'
          if($LASTEXITCODE -ne 0){throw 'Settings transfer compatibility test failed'}

      - name: Verify all requested feature markers
        id: verify
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src = Get-Content 'desktop\v1.11_final.pyw' -Raw
          @(
            'Select Auto-Allocated',
            'Correct auto-allocation',
            'Use amount-based allocation rule',
            'Pastel description',
            'amount_condition_matches',
            'Corrected allocation',
            'Export settings backup…',
            'Import settings backup / v1.10 database…',
            'read_settings_transfer'
          ) | ForEach-Object {
            if(!$src.Contains($_)){throw "Missing feature marker: $_"}
          }

      - name: Install PyInstaller
        id: install
        shell: powershell
        run: |
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}

      - name: Build portable Windows folder
        id: pyinstaller
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'desktop\v111release' | Out-Null
          Copy-Item 'desktop\v1.11_final.pyw' 'desktop\v111release\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v111release'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11" pastel_payment_assistant.pyw
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw 'PyInstaller build failed'}

      - name: Package portable ZIP
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='desktop\v111release\dist\Pastel Payment Assistant v1.11'
          if(!(Test-Path $src)){throw 'Portable application folder was not created'}
          Copy-Item $src 'Pastel-Payment-Assistant-v1.11-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.exe',
            '',
            'New in v1.11:',
            '- Assign a Pastel description to saved rules and one-off transactions.',
            '- Optional amount-based GL allocation using <, <=, >, >= or =.',
            '- Select Auto-Allocated ticks only untouched automatic allocations.',
            '- Correct a false auto-allocation and optionally update its saved rule.',
            '- Corrected rows remain visibly marked and stay out of Select Auto-Allocated until reset.',
            '- Export Settings Backup and Import Settings Backup / v1.10 database.',
            '- Existing v1.10 settings on the same PC are retained automatically.',
            '',
            'The Cash Book bank GL remains the batch-level Pastel import column L setting.',
            '',
            'If corporate endpoint security blocks the application, ask IT/security to review or allow it rather than disabling security controls.'
          ) | Set-Content 'Pastel-Payment-Assistant-v1.11-Portable\README.txt'
          Compress-Archive 'Pastel-Payment-Assistant-v1.11-Portable' 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Force
          $hash=(Get-FileHash 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'Pastel-Payment-Assistant-v1.11-Portable.sha256.txt'

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Pastel-Payment-Assistant-v1.11-Portable-Windows
          path: |
            Pastel-Payment-Assistant-v1.11-Portable.zip
            Pastel-Payment-Assistant-v1.11-Portable.sha256.txt

      - name: Publish v1.11 release
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-v1.11-portable --cleanup-tag -y 2>$null
          gh release create desktop-v1.11-portable Pastel-Payment-Assistant-v1.11-Portable.zip Pastel-Payment-Assistant-v1.11-Portable.sha256.txt --title "Pastel Payment Assistant v1.11 - Portable Windows" --notes "Adds Pastel transaction descriptions, optional amount-based GL allocation rules, Select Auto-Allocated, false auto-allocation correction with optional saved-rule updates, and settings export/import including v1.10 database compatibility."
          if($LASTEXITCODE -ne 0){throw 'GitHub release creation failed'}

      - name: Record final build status and source
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $lines=@(
            'Pastel Payment Assistant v1.11 final Windows build status',
            "Source commit: $env:GITHUB_SHA",
            'patch=${{ steps.patch.outcome }}',
            'test=${{ steps.test.outcome }}',
            'transfer_test=${{ steps.transfer_test.outcome }}',
            'verify=${{ steps.verify.outcome }}',
            'install=${{ steps.install.outcome }}',
            'pyinstaller=${{ steps.pyinstaller.outcome }}',
            'package=${{ steps.package.outcome }}',
            'upload=${{ steps.upload.outcome }}',
            'release=${{ steps.release.outcome }}'
          )
          if(Test-Path 'Pastel-Payment-Assistant-v1.11-Portable.zip'){
            $hash=(Get-FileHash 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Algorithm SHA256).Hash.ToLower()
            $lines += "Portable ZIP SHA256: $hash"
          }
          $lines | Set-Content 'desktop\BUILD_DESKTOP_V1.11_WITH_SETTINGS_STATUS.txt'
          if(Test-Path 'desktop\v1.11_final.pyw'){Copy-Item 'desktop\v1.11_final.pyw' 'desktop\v1.11_candidate.pyw' -Force}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11_WITH_SETTINGS_STATUS.txt' 'desktop/v1.11_candidate.pyw'
          if(Test-Path 'desktop\V111_FINAL_SELF_TEST.txt'){git add 'desktop/V111_FINAL_SELF_TEST.txt'}
          if(Test-Path 'desktop\V111_FINAL_SETTINGS_TRANSFER_TEST.txt'){git add 'desktop/V111_FINAL_SETTINGS_TRANSFER_TEST.txt'}
          git commit -m 'Record final v1.11 build with settings transfer [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
