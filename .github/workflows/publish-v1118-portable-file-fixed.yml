name: Publish Pastel Payment Assistant v1.11.8 Portable Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1118-portable-file-fixed.yml'
      - 'desktop/v1.11.8_pre_remove_main_review_method.py'
      - 'desktop/v1.11.8_rule_dialog_review_table_transform.py'

permissions:
  contents: write

jobs:
  publish-file:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and test v1.11.8 source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.8_release.pyw' -Encoding utf8
          python 'desktop\v1.11.1_strict_match_transform.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.1 transform failed'}
          python 'desktop\v1.11.2_global_match_transform.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.2 transform failed'}
          python 'desktop\v1.11.3_amount_description_transform.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.3 transform failed'}
          python 'desktop\v1.11.4_amount_review_transform.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.4 transform failed'}
          python 'desktop\v1.11.5_sequential_reference_transform.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.5 transform failed'}
          python 'desktop\v1.11.6_profiles_transform.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.6 transform failed'}
          python 'desktop\v1.11.7_multi_review_assignment_transform.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.7 transform failed'}
          python 'desktop\v1.11.8_pre_remove_main_review_method.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.8 pre-transform failed'}
          python 'desktop\v1.11.8_rule_dialog_review_table_transform.py' 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.8 transform failed'}
          python -m py_compile 'desktop\v1.11.8_release.pyw'; if($LASTEXITCODE -ne 0){throw 'compile failed'}
          python 'desktop\v1.11.8_release.pyw' --self-test; if($LASTEXITCODE -ne 0){throw 'self-test failed'}
          $src=Get-Content 'desktop\v1.11.8_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.8"')){throw 'Version marker missing'}
          if(!$src.Contains('Transactions caught by this amount condition')){throw 'Embedded table missing'}
          if(!$src.Contains('Assign selected…')){throw 'Embedded assign button missing'}
          if($src.Contains('"review": "Allocate"')){throw 'Old main Allocate column remains'}
          if($src.Contains('text="Assign selected review items"')){throw 'Old main review button remains'}
          if(!$src.Contains('Company profile:')){throw 'Profiles missing'}
          if(!$src.Contains('assign_monthly_sequential_references')){throw 'Sequential refs missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Strict matching missing'}
      - name: Build portable Windows app
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          New-Item -ItemType Directory -Force 'desktop\v1118repo' | Out-Null
          Copy-Item 'desktop\v1.11.8_release.pyw' 'desktop\v1118repo\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v1118repo'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.8" pastel_payment_assistant.pyw
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v1118repo\dist\Pastel Payment Assistant v1.11.8'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.8 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.8.exe',
            '',
            'Corrected amount review workflow:',
            '- In the Assign/Edit Rule window, choose Review each qualifying transaction.',
            '- A table appears directly underneath showing every current-statement transaction caught by that amount condition.',
            '- Tick one or many rows and click Assign selected.',
            '- Assign 3 rows to PETROL, then a different row to SURVEY, etc.',
            '- Only the selected rows receive that allocation; unselected qualifying rows stay untouched.',
            '- The old v1.11.7 main-screen Allocate column/button has been removed.',
            '',
            'Retains company profiles, unique monthly Pastel references, amount descriptions, and strict allocation matching.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable\README.txt'
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.zip').Length -ge 100MB){throw 'Portable ZIP too large'}
      - name: Commit successful package
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable' -Recurse -Force
          Remove-Item 'desktop\v1118repo' -Recurse -Force
          Remove-Item 'desktop\v1.11.8_release.pyw' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.8 portable package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed (same method as v1.10)',
            'Embedded Rule-window amount review table tests: passed',
            'Grouped PETROL/SURVEY allocation tests: passed',
            'Old main-screen Allocate control removal check: passed',
            'Company profile isolation tests: passed',
            'Monthly sequential and same-date unique-reference tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.8_RULE_REVIEW_TABLE_SUCCESS.txt'
          Remove-Item 'desktop\BUILD_DESKTOP_V1.11.8_RULE_REVIEW_TABLE_FAILURE.txt' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A 'desktop/Pastel-Payment-Assistant-v1.11.8-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.8-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.8_RULE_REVIEW_TABLE_SUCCESS.txt' 'desktop/BUILD_DESKTOP_V1.11.8_RULE_REVIEW_TABLE_FAILURE.txt'
          git commit -m 'Publish Pastel Payment Assistant v1.11.8 portable [skip ci]'
          git push
      - name: Record failure
        if: failure()
        shell: powershell
        run: |
          @('Pastel Payment Assistant v1.11.8 fixed package failed.','source=${{ steps.source.outcome }}','build=${{ steps.build.outcome }}','commit=${{ steps.commit.outcome }}') | Set-Content 'desktop\BUILD_DESKTOP_V1.11.8_FIXED_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11.8_FIXED_FAILURE.txt'
          git commit -m 'Record v1.11.8 fixed package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
