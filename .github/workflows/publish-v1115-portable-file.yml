name: Publish Pastel Payment Assistant v1.11.5 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1115-portable-file.yml'
      - 'desktop/v1.11.5_sequential_reference_transform.py'
      - 'desktop/v1.11.4_amount_review_transform.py'
      - 'desktop/v1.11.3_amount_description_transform.py'
      - 'desktop/v1.11.2_global_match_transform.py'
      - 'desktop/v1.11.1_strict_match_transform.py'

permissions:
  contents: write

jobs:
  publish-file:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare v1.11.5 source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.5_release.pyw' -Encoding utf8
          python 'desktop\v1.11.1_strict_match_transform.py' 'desktop\v1.11.5_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.1 strict-match transform failed'}
          python 'desktop\v1.11.2_global_match_transform.py' 'desktop\v1.11.5_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.2 global safety transform failed'}
          python 'desktop\v1.11.3_amount_description_transform.py' 'desktop\v1.11.5_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.3 amount-description transform failed'}
          python 'desktop\v1.11.4_amount_review_transform.py' 'desktop\v1.11.5_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.4 amount-review transform failed'}
          python 'desktop\v1.11.5_sequential_reference_transform.py' 'desktop\v1.11.5_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.5 sequential-reference transform failed'}
          python -m py_compile 'desktop\v1.11.5_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.5 compile failed'}
          python 'desktop\v1.11.5_release.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'v1.11.5 self-test failed'}
          $src=Get-Content 'desktop\v1.11.5_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.5"')){throw 'Version marker missing'}
          if(!$src.Contains('assign_monthly_sequential_references')){throw 'Sequential reference generator missing'}
          if(!$src.Contains('P6-0001')){throw 'Payment reference regression test missing'}
          if(!$src.Contains('R6-0001')){throw 'Receipt reference regression test missing'}
          if(!$src.Contains('duplicate Pastel reference')){throw 'Duplicate reference export protection missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Global allocation safety gate missing'}
          if(!$src.Contains('Review each qualifying transaction')){throw 'Amount review mode missing'}

      - name: Build portable package like v1.10
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}
          New-Item -ItemType Directory -Force 'desktop\v1115repo' | Out-Null
          Copy-Item 'desktop\v1.11.5_release.pyw' 'desktop\v1115repo\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v1115repo'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.5" pastel_payment_assistant.pyw
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v1115repo\dist\Pastel Payment Assistant v1.11.5'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.5 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.5.exe',
            '',
            'Built using the same PyInstaller --onedir --windowed packaging method as v1.10.',
            'Existing rules/settings remain compatible.',
            '',
            'v1.11.5 automatic Pastel references:',
            '- Every individual payment receives a unique calendar-month sequence such as P6-0001, P6-0002, P6-0003.',
            '- Multiple payments on the same date still receive separate consecutive references, ordered by the original bank-statement row.',
            '- Receipts use a separate R sequence such as R6-0001, R6-0002.',
            '- The sequence changes with the calendar month, e.g. July starts at P7-0001 / R7-0001.',
            '- Saved-rule/manual reference text cannot override the generated transaction reference at export.',
            '- Export validation blocks duplicate generated references.',
            '- v1.11.4 amount-review mode and v1.11.2 global strict name/reference allocation safety remain enabled.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable\README.txt'
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable.zip').Length -ge 100MB){throw 'Portable ZIP too large'}

      - name: Commit portable ZIP to main
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable' -Recurse -Force
          Remove-Item 'desktop\v1115repo' -Recurse -Force
          Remove-Item 'desktop\v1.11.5_release.pyw' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.5-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.5 portable package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed (same method as v1.10)',
            'Monthly sequential payment/receipt reference tests: passed',
            'Same-date unique-reference tests: passed',
            'Duplicate-reference export protection tests: passed',
            'Amount-review and alternative-description tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.5_SEQUENTIAL_REFERENCE_SUCCESS.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/Pastel-Payment-Assistant-v1.11.5-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.5-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.5_SEQUENTIAL_REFERENCE_SUCCESS.txt'
          git commit -m 'Publish Pastel Payment Assistant v1.11.5 portable [skip ci]'
          git push

      - name: Record failure status
        if: failure()
        shell: powershell
        run: |
          @(
            'Pastel Payment Assistant v1.11.5 package failed.',
            'source=${{ steps.source.outcome }}',
            'build=${{ steps.build.outcome }}',
            'commit=${{ steps.commit.outcome }}'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.5_SEQUENTIAL_REFERENCE_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11.5_SEQUENTIAL_REFERENCE_FAILURE.txt'
          git commit -m 'Record v1.11.5 package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
