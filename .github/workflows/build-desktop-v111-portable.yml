name: Build Pastel Payment Assistant v1.11 Portable

on:
  push:
    branches:
      - feature/v1.11-allocation-controls
    paths:
      - '.github/workflows/build-desktop-v111-portable.yml'
      - 'desktop/v1.11_transform.py'
      - 'desktop/v1.10_source/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare v1.11 source
        id: transform
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'desktop\v111build' | Out-Null
          Copy-Item 'desktop\v1.10_source\pastel_payment_assistant.pyw' 'desktop\v111build\pastel_payment_assistant.pyw' -Force
          python 'desktop\v1.11_transform.py' 'desktop\v111build\pastel_payment_assistant.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11 source transformation failed'}
          $version = Select-String -Path 'desktop\v111build\pastel_payment_assistant.pyw' -Pattern 'APP_VERSION = "1.11.0"'
          if(!$version){throw 'v1.11 version marker not found'}

      - name: Validate source and self-tests
        id: test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile 'desktop\v111build\pastel_payment_assistant.pyw'
          if($LASTEXITCODE -ne 0){throw 'Python source validation failed'}
          python 'desktop\v111build\pastel_payment_assistant.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'v1.11 self-test failed'}

      - name: Verify requested feature markers
        id: verify
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src = Get-Content 'desktop\v111build\pastel_payment_assistant.pyw' -Raw
          @(
            'Select Auto-Allocated',
            'Correct auto-allocation',
            'Use amount-based allocation rule',
            'Pastel description',
            'amount_condition_matches',
            'Corrected allocation'
          ) | ForEach-Object {
            if(!$src.Contains($_)){throw "Missing feature marker: $_"}
          }

      - name: Install PyInstaller
        id: install
        shell: powershell
        run: |
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}

      - name: Build portable folder
        id: pyinstaller
        shell: powershell
        working-directory: desktop\v111build
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11" pastel_payment_assistant.pyw
          if($LASTEXITCODE -ne 0){throw 'PyInstaller build failed'}

      - name: Package portable ZIP
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='desktop\v111build\dist\Pastel Payment Assistant v1.11'
          if(!(Test-Path $src)){throw 'Portable application folder was not created'}
          Copy-Item $src 'Pastel-Payment-Assistant-v1.11-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.exe',
            '',
            'New in v1.11:',
            '- Saved and transaction-specific Pastel descriptions.',
            '- Optional amount-based allocation per rule, e.g. if amount < R500 allocate to a different GL.',
            '- Select Auto-Allocated to tick only untouched automatic allocations.',
            '- Correct false auto-allocations and optionally update the saved rule for future transactions.',
            '- Corrected rows are clearly marked and are not included by Select Auto-Allocated until reset to the saved rule.',
            '',
            'The Cash Book bank GL remains a batch-level setting in Pastel import column L; no per-transaction contra is added.',
            '',
            'If corporate endpoint security blocks the application, ask IT/security to review or allow it rather than disabling security controls.'
          ) | Set-Content 'Pastel-Payment-Assistant-v1.11-Portable\README.txt'
          Compress-Archive 'Pastel-Payment-Assistant-v1.11-Portable' 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Force
          $hash=(Get-FileHash 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'Pastel-Payment-Assistant-v1.11-Portable.sha256.txt'

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Pastel-Payment-Assistant-v1.11-Portable-Windows
          path: |
            Pastel-Payment-Assistant-v1.11-Portable.zip
            Pastel-Payment-Assistant-v1.11-Portable.sha256.txt

      - name: Publish release
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-v1.11-portable --cleanup-tag -y 2>$null
          gh release create desktop-v1.11-portable Pastel-Payment-Assistant-v1.11-Portable.zip Pastel-Payment-Assistant-v1.11-Portable.sha256.txt --title "Pastel Payment Assistant v1.11 - Portable Windows" --notes "Adds transaction descriptions, optional amount-based GL allocation rules, Select Auto-Allocated, and false-auto-allocation correction with optional saved-rule updates. Corrected rows remain visibly marked and are excluded from Select Auto-Allocated until reset."
          if($LASTEXITCODE -ne 0){throw 'GitHub release creation failed'}

      - name: Commit v1.11 source snapshot and status
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          New-Item -ItemType Directory -Force 'desktop\v1.11_source' | Out-Null
          if(Test-Path 'desktop\v111build\pastel_payment_assistant.pyw'){
            Copy-Item 'desktop\v111build\pastel_payment_assistant.pyw' 'desktop\v1.11_source\pastel_payment_assistant.pyw' -Force
          }
          $lines=@(
            'Pastel Payment Assistant v1.11 portable Windows build status',
            "Source commit: $env:GITHUB_SHA",
            'transform=${{ steps.transform.outcome }}',
            'test=${{ steps.test.outcome }}',
            'verify=${{ steps.verify.outcome }}',
            'install=${{ steps.install.outcome }}',
            'pyinstaller=${{ steps.pyinstaller.outcome }}',
            'package=${{ steps.package.outcome }}',
            'upload=${{ steps.upload.outcome }}',
            'release=${{ steps.release.outcome }}'
          )
          if(Test-Path 'Pastel-Payment-Assistant-v1.11-Portable.zip'){
            $hash=(Get-FileHash 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Algorithm SHA256).Hash.ToLower()
            $lines += "Portable ZIP SHA256: $hash"
          }
          $lines | Set-Content 'desktop\BUILD_DESKTOP_V1.11_PORTABLE_STATUS.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/v1.11_source/pastel_payment_assistant.pyw' 'desktop/BUILD_DESKTOP_V1.11_PORTABLE_STATUS.txt'
          git commit -m 'Record v1.11 portable build and source [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
