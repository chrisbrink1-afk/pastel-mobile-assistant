name: Rebuild Pastel Payment Assistant v1.11.12 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-v11112-portable.yml'
      - 'desktop/v1.11.12_rule_edits_stay_auto_transform.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pastel-v11112-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and test v1.11.12 source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.12_release.pyw' -Encoding utf8
          python 'desktop\v1.11.1_strict_match_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.1 transform failed'}
          python 'desktop\v1.11.2_global_match_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.2 transform failed'}
          python 'desktop\v1.11.3_amount_description_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.3 transform failed'}
          python 'desktop\v1.11.4_amount_review_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.4 transform failed'}
          python 'desktop\v1.11.5_sequential_reference_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.5 transform failed'}
          python 'desktop\v1.11.6_profiles_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.6 transform failed'}
          python 'desktop\v1.11.7_multi_review_assignment_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.7 transform failed'}
          python 'desktop\v1.11.8_pre_remove_main_review_method.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.8 pre-transform failed'}
          python 'desktop\v1.11.8_rule_dialog_review_table_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.8 transform failed'}
          python 'desktop\v1.11.9_visible_rule_assignment_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.9 transform failed'}
          python 'desktop\v1.11.10_resizable_rule_dialog_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.10 transform failed'}
          python 'desktop\v1.11.11_scrollable_rule_dialog_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.11 transform failed'}
          python 'desktop\v1.11.12_rule_edits_stay_auto_transform.py' 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.12 transform failed'}
          python -m py_compile 'desktop\v1.11.12_release.pyw'; if($LASTEXITCODE -ne 0){throw 'compile failed'}
          python 'desktop\v1.11.12_release.pyw' --self-test; if($LASTEXITCODE -ne 0){throw 'self-test failed'}
          $src=Get-Content 'desktop\v1.11.12_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.12"')){throw 'Version marker missing'}
          if(!$src.Contains('Saved rule updated and reapplied. Matching transactions are automatic allocations')){throw 'Saved-rule automatic marker missing'}
          if($src.Contains('Corrected allocation • saved rule updated')){throw 'Old saved-rule corrected status still present'}
          if(!$src.Contains('selected = bool(t.auto_allocated and t.account and not t.ambiguous)')){throw 'Select Auto-Allocated behavior missing'}
          if(!$src.Contains('self.resizable(True, True)')){throw 'Resizable RuleDialog missing'}
          if(!$src.Contains('self.rule_vscroll') -or !$src.Contains('self.rule_hscroll')){throw 'RuleDialog scrolling missing'}
          if(!$src.Contains('amount_review_assign_button')){throw 'Assign selected control missing'}
          if(!$src.Contains('Company profile:')){throw 'Profiles missing'}
          if(!$src.Contains('assign_monthly_sequential_references')){throw 'Sequential refs missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Strict matching missing'}

      - name: Build portable Windows app
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller install failed'}
          Remove-Item 'desktop\v11112rebuild' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'desktop\v11112rebuild' | Out-Null
          Copy-Item 'desktop\v1.11.12_release.pyw' 'desktop\v11112rebuild\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v11112rebuild'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.12" pastel_payment_assistant.pyw
          $buildCode=$LASTEXITCODE
          Pop-Location
          if($buildCode -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v11112rebuild\dist\Pastel Payment Assistant v1.11.12'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.12 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.12.exe',
            '',
            'v1.11.12 allocation behavior:',
            '- If Correct auto-allocation updates the SAVED rule, that transaction is reapplied as an automatic allocation.',
            '- Matching recurring payments/receipts remain auto_allocated after the saved rule is changed.',
            '- Select Auto-Allocated and Select auto-allocated recurring will tick those saved-rule allocations.',
            '- A correction for this statement only remains manual/corrected and is not selected automatically.',
            '',
            'Retains resizable/scrollable Rule windows, amount-review allocation controls, profiles, monthly references, and strict matching.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable\README.txt'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable.zip' -Force -ErrorAction SilentlyContinue
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable.zip').Length -ge 100MB){throw 'Portable ZIP too large'}

      - name: Publish successful package and stop retries
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.12 portable package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed',
            'Saved-rule edits remain automatic allocation check: passed',
            'Select Auto-Allocated recurring compatibility check: passed',
            'Statement-only correction remains manual check: passed',
            'Resizable and scrollable Rule dialog checks: passed',
            'Always-visible Assign selected toolbar check: passed',
            'Company profile isolation tests: passed',
            'Monthly sequential reference tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.12_RULE_EDITS_AUTO_SUCCESS.txt'
          Remove-Item 'desktop\BUILD_DESKTOP_V1.11.12_RULE_EDITS_AUTO_FAILURE.txt' -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\v11112rebuild' -Recurse -Force
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.12-Portable' -Recurse -Force
          Remove-Item 'desktop\v1.11.12_release.pyw' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A 'desktop/Pastel-Payment-Assistant-v1.11.12-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.12-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.12_RULE_EDITS_AUTO_SUCCESS.txt' 'desktop/BUILD_DESKTOP_V1.11.12_RULE_EDITS_AUTO_FAILURE.txt'
          git rm '.github/workflows/rebuild-v11112-portable.yml'
          git commit -m 'Publish Pastel Payment Assistant v1.11.12 portable [skip ci]'
          git push

      - name: Record failure
        if: failure()
        shell: powershell
        run: |
          @(
            'Pastel Payment Assistant v1.11.12 package failed.',
            "run=${{ github.run_id }} attempt=${{ github.run_attempt }}",
            'source=${{ steps.source.outcome }}',
            'build=${{ steps.build.outcome }}',
            'commit=${{ steps.commit.outcome }}'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.12_RULE_EDITS_AUTO_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11.12_RULE_EDITS_AUTO_FAILURE.txt'
          git commit -m 'Record v1.11.12 package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
