name: Rebuild Pastel Payment Assistant v1.11.9 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-v1119-portable.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pastel-v1119-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare v1.11.9 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.9_release.pyw' -Encoding utf8
          python 'desktop\v1.11.1_strict_match_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.1 transform failed'}
          python 'desktop\v1.11.2_global_match_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.2 transform failed'}
          python 'desktop\v1.11.3_amount_description_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.3 transform failed'}
          python 'desktop\v1.11.4_amount_review_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.4 transform failed'}
          python 'desktop\v1.11.5_sequential_reference_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.5 transform failed'}
          python 'desktop\v1.11.6_profiles_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.6 transform failed'}
          python 'desktop\v1.11.7_multi_review_assignment_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.7 transform failed'}
          python 'desktop\v1.11.8_pre_remove_main_review_method.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.8 pre-transform failed'}
          python 'desktop\v1.11.8_rule_dialog_review_table_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.8 transform failed'}
          python 'desktop\v1.11.9_visible_rule_assignment_transform.py' 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.9 transform failed'}
          python -m py_compile 'desktop\v1.11.9_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'compile failed'}
          python 'desktop\v1.11.9_release.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'self-test failed'}
          $src=Get-Content 'desktop\v1.11.9_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.9"')){throw 'Version marker missing'}
          if(!$src.Contains('Tick the transactions to allocate, then:')){throw 'Visible allocation toolbar missing'}
          if(!$src.Contains('amount_review_assign_button')){throw 'Assign button marker missing'}
          if(!$src.Contains('Assign selected ({selected_count})')){throw 'Selected-count marker missing'}
          if(!$src.Contains('Company profile:')){throw 'Profiles missing'}
          if(!$src.Contains('assign_monthly_sequential_references')){throw 'Sequential refs missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Strict matching missing'}

      - name: Build portable Windows app
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller install failed'}
          Remove-Item 'desktop\v1119rebuild' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'desktop\v1119rebuild' | Out-Null
          Copy-Item 'desktop\v1.11.9_release.pyw' 'desktop\v1119rebuild\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v1119rebuild'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.9" pastel_payment_assistant.pyw
          $buildCode=$LASTEXITCODE
          Pop-Location
          if($buildCode -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v1119rebuild\dist\Pastel Payment Assistant v1.11.9'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.9 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep the extracted folder together.',
            'Run: Pastel Payment Assistant v1.11.9.exe',
            '',
            'Amount review allocation fix:',
            '- In the Rule window, the allocation toolbar is above the transaction table.',
            '- Tick one or more qualifying transactions.',
            '- The button shows Assign selected (N).',
            '- Click it to allocate exactly those selected rows.',
            '- Unselected qualifying transactions remain untouched.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable\README.txt'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip' -Force -ErrorAction SilentlyContinue
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip').Length -ge 100MB){throw 'Portable ZIP too large'}

      - name: Publish successful package and stop retries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.9 portable package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed',
            'Always-visible Assign selected toolbar check: passed',
            'Embedded amount-review table tests: passed',
            'Grouped PETROL/SURVEY allocation tests: passed',
            'Company profile isolation tests: passed',
            'Monthly sequential reference tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.9_VISIBLE_ASSIGN_SUCCESS.txt'
          Remove-Item 'desktop\v1119rebuild' -Recurse -Force
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable' -Recurse -Force
          Remove-Item 'desktop\v1.11.9_release.pyw' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/Pastel-Payment-Assistant-v1.11.9-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.9-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.9_VISIBLE_ASSIGN_SUCCESS.txt'
          git rm '.github/workflows/rebuild-v1119-portable.yml'
          git commit -m 'Publish Pastel Payment Assistant v1.11.9 portable [skip ci]'
          git push
