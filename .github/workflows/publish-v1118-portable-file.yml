name: Publish Pastel Payment Assistant v1.11.8 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1118-portable-file.yml'
      - 'desktop/v1.11.8_rule_dialog_review_table_transform.py'
      - 'desktop/v1.11.7_multi_review_assignment_transform.py'
      - 'desktop/v1.11.6_profiles_transform.py'
      - 'desktop/v1.11.5_sequential_reference_transform.py'
      - 'desktop/v1.11.4_amount_review_transform.py'
      - 'desktop/v1.11.3_amount_description_transform.py'
      - 'desktop/v1.11.2_global_match_transform.py'
      - 'desktop/v1.11.1_strict_match_transform.py'

permissions:
  contents: write

jobs:
  publish-file:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare v1.11.8 source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.8_release.pyw' -Encoding utf8
          python 'desktop\v1.11.1_strict_match_transform.py' 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.1 strict-match transform failed'}
          python 'desktop\v1.11.2_global_match_transform.py' 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.2 global safety transform failed'}
          python 'desktop\v1.11.3_amount_description_transform.py' 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.3 amount-description transform failed'}
          python 'desktop\v1.11.4_amount_review_transform.py' 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.4 amount-review transform failed'}
          python 'desktop\v1.11.5_sequential_reference_transform.py' 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.5 sequential-reference transform failed'}
          python 'desktop\v1.11.6_profiles_transform.py' 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.6 profiles transform failed'}
          python 'desktop\v1.11.7_multi_review_assignment_transform.py' 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.7 multi-review transform failed'}
          python 'desktop\v1.11.8_rule_dialog_review_table_transform.py' 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.8 rule-dialog review transform failed'}
          python -m py_compile 'desktop\v1.11.8_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.8 compile failed'}
          python 'desktop\v1.11.8_release.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'v1.11.8 self-test failed'}
          $src=Get-Content 'desktop\v1.11.8_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.8"')){throw 'Version marker missing'}
          if(!$src.Contains('Transactions caught by this amount condition')){throw 'Embedded rule review table missing'}
          if(!$src.Contains('Assign selected…')){throw 'Embedded grouped assignment button missing'}
          if(!$src.Contains('rule_window_amount_candidates')){throw 'Rule-window candidate helper missing'}
          if($src.Contains('"review": "Allocate"')){throw 'Old main-screen Allocate column still present'}
          if($src.Contains('text="Assign selected review items"')){throw 'Old main-screen review button still present'}
          if(!$src.Contains('Company profile:')){throw 'Company profiles missing'}
          if(!$src.Contains('assign_monthly_sequential_references')){throw 'Sequential reference generator missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Strict allocation safety missing'}

      - name: Build portable package like v1.10
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}
          New-Item -ItemType Directory -Force 'desktop\v1118repo' | Out-Null
          Copy-Item 'desktop\v1.11.8_release.pyw' 'desktop\v1118repo\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v1118repo'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.8" pastel_payment_assistant.pyw
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v1118repo\dist\Pastel Payment Assistant v1.11.8'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.8 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.8.exe',
            '',
            'Built using the same PyInstaller --onedir --windowed packaging method as v1.10.',
            '',
            'v1.11.8 corrected Amount Review workflow:',
            '- The transaction selection table is inside the Assign/Edit Rule window, directly under the amount-based allocation setting.',
            '- Choose Review each qualifying transaction to display the current statement rows caught by that amount condition.',
            '- The table shows each qualifying payment/receipt separately with date, amount, bank description, assigned GL and Pastel description.',
            '- Tick one or many rows and click Assign selected to give only those rows a GL/description/VAT allocation.',
            '- Example: select 3 qualifying payments and assign PETROL, then select a different payment and assign SURVEY before saving the rule.',
            '- Unselected qualifying rows remain untouched/unallocated for separate decisions.',
            '- The incorrect v1.11.7 main-screen Allocate column/button has been removed.',
            '',
            'Retained features:',
            '- v1.11.6 isolated company profiles.',
            '- v1.11.5 unique monthly Pastel references such as P6-0001 / R6-0001, including same-date sequencing.',
            '- v1.11.4 amount-review mode.',
            '- v1.11.3 alternative amount descriptions.',
            '- v1.11.2 global strict name/reference allocation safety for all payments and receipts.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable\README.txt'
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.zip').Length -ge 100MB){throw 'Portable ZIP too large'}

      - name: Commit portable ZIP to main
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable' -Recurse -Force
          Remove-Item 'desktop\v1118repo' -Recurse -Force
          Remove-Item 'desktop\v1.11.8_release.pyw' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.8-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.8 portable package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed (same method as v1.10)',
            'Embedded Rule-window amount review table tests: passed',
            'Grouped PETROL/SURVEY allocation tests: passed',
            'Company profile isolation tests: passed',
            'Monthly sequential and same-date unique-reference tests: passed',
            'Amount-review and alternative-description tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.8_RULE_REVIEW_TABLE_SUCCESS.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/Pastel-Payment-Assistant-v1.11.8-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.8-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.8_RULE_REVIEW_TABLE_SUCCESS.txt'
          git commit -m 'Publish Pastel Payment Assistant v1.11.8 portable [skip ci]'
          git push

      - name: Record failure status
        if: failure()
        shell: powershell
        run: |
          @(
            'Pastel Payment Assistant v1.11.8 package failed.',
            'source=${{ steps.source.outcome }}',
            'build=${{ steps.build.outcome }}',
            'commit=${{ steps.commit.outcome }}'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.8_RULE_REVIEW_TABLE_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11.8_RULE_REVIEW_TABLE_FAILURE.txt'
          git commit -m 'Record v1.11.8 package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
