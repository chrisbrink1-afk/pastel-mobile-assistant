name: Rebuild Pastel Payment Assistant v1.11.20 Personal and v2.0.1 Clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-v11120-v201-portable.yml'
      - 'desktop/v1.11.20_recurring_payee_identity_transform.py'
      - 'desktop/v2.0.1_clean_feedback_transform.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pastel-v11120-v201-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and test v1.11.20 Personal source
        id: source_personal
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.20_release.pyw' -Encoding utf8
          $transforms = @(
            'desktop\v1.11.1_strict_match_transform.py',
            'desktop\v1.11.2_global_match_transform.py',
            'desktop\v1.11.3_amount_description_transform.py',
            'desktop\v1.11.4_amount_review_transform.py',
            'desktop\v1.11.5_sequential_reference_transform.py',
            'desktop\v1.11.6_profiles_transform.py',
            'desktop\v1.11.7_multi_review_assignment_transform.py',
            'desktop\v1.11.8_pre_remove_main_review_method.py',
            'desktop\v1.11.8_rule_dialog_review_table_transform.py',
            'desktop\v1.11.9_visible_rule_assignment_transform.py',
            'desktop\v1.11.10_resizable_rule_dialog_transform.py',
            'desktop\v1.11.11_scrollable_rule_dialog_transform.py',
            'desktop\v1.11.12_rule_edits_stay_auto_transform.py',
            'desktop\v1.11.13_select_manual_allocations_transform.py',
            'desktop\v1.11.14_additive_allocation_selection_transform.py',
            'desktop\v1.11.15_user_friendly_help_transform.py',
            'desktop\v1.11.16_recurring_identity_apply_transform.py',
            'desktop\v1.11.17_blank_details_identity_transform.py',
            'desktop\v1.11.18_receipt_bank_sign_transform.py',
            'desktop\v1.11.19_autosave_session_transform.py',
            'desktop\v1.11.20_recurring_payee_identity_transform.py'
          )
          foreach($t in $transforms){ python $t 'desktop\v1.11.20_release.pyw'; if($LASTEXITCODE -ne 0){throw "Transform failed: $t"} }
          python -m py_compile 'desktop\v1.11.20_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.20 compile failed'}
          python 'desktop\v1.11.20_release.pyw' --self-test; if($LASTEXITCODE -ne 0){throw 'v1.11.20 self-test failed'}
          $src=Get-Content 'desktop\v1.11.20_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.20"')){throw 'Personal version marker missing'}
          if(!$src.Contains('def recurring_identity_key')){throw 'Recurring identity helper missing'}
          if(!$src.Contains('MARY HARTSLIEF')){throw 'Verified Mary payee normalization missing'}
          if(!$src.Contains('key = recurring_identity_key(t.details, t.txn_type)')){throw 'History recurrence normalization missing'}
          if(!$src.Contains('ON CONFLICT(signature) DO UPDATE SET')){throw 'History recurrence migration/upsert missing'}
          if(!$src.Contains('self.store.remember_transactions(self.txns)')){throw 'Autosaved-session recurrence recalculation missing'}
          if(!$src.Contains('signed_gross = -gross if direction == "RECEIPT" else gross')){throw 'Receipt positive-bank sign fix missing'}
          if(!$src.Contains('SESSION_SETTING_KEY = "__autosaved_session_v1"')){throw 'Autosave/session restore missing'}
          if(!$src.Contains('canonical and p == canonical')){throw 'Blank-detail identity guard missing'}
          if(!$src.Contains('Existing manual selections were preserved')){throw 'Additive auto-selection behavior missing'}
          if(!$src.Contains('Existing automatic selections were preserved')){throw 'Additive manual-selection behavior missing'}
          if(!$src.Contains('class HoverHelp')){throw 'Hover help missing'}
          if(!$src.Contains('Company profile:')){throw 'Profiles missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Strict allocation matching missing'}

      - name: Prepare and test v2.0.1 Clean source
        id: source_clean
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item 'desktop\v1.11.20_release.pyw' 'desktop\v2.0.1_clean_release.pyw' -Force
          python 'desktop\v2.0.1_clean_feedback_transform.py' 'desktop\v2.0.1_clean_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v2.0.1 clean transform failed'}
          python -m py_compile 'desktop\v2.0.1_clean_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v2.0.1 compile failed'}
          python 'desktop\v2.0.1_clean_release.pyw' --self-test; if($LASTEXITCODE -ne 0){throw 'v2.0.1 self-test failed'}
          $src=Get-Content 'desktop\v2.0.1_clean_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "2.0.1"')){throw 'Clean version marker missing'}
          if(!$src.Contains('APP_DATA_NAMESPACE = "PastelPaymentAssistantV2Feedback"')){throw 'Clean isolated AppData namespace missing'}
          if(!$src.Contains('ALLOW_BUNDLED_RULE_BOOTSTRAP = False')){throw 'Private bootstrap not disabled'}
          if(!$src.Contains('def recurring_identity_key')){throw 'Recurring payee fix missing from clean build'}
          if(!$src.Contains('MARY HARTSLIEF')){throw 'Mary recurrence normalization missing from clean build'}
          if(!$src.Contains('signed_gross = -gross if direction == "RECEIPT" else gross')){throw 'Receipt sign fix missing from clean build'}
          if(!$src.Contains('def _save_session(self)') -or !$src.Contains('def _restore_session(self)')){throw 'Autosave/resume missing from clean build'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Strict allocation matching missing from clean build'}

      - name: Build both portable Windows apps
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller install failed'}

          Remove-Item 'desktop\v11120rebuild' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\v201rebuild' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable' -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force 'desktop\v11120rebuild' | Out-Null
          Copy-Item 'desktop\v1.11.20_release.pyw' 'desktop\v11120rebuild\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v11120rebuild'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.20 Personal" pastel_payment_assistant.pyw
          $personalCode=$LASTEXITCODE
          Pop-Location
          if($personalCode -ne 0){throw 'v1.11.20 Personal PyInstaller build failed'}
          $personalApp='desktop\v11120rebuild\dist\Pastel Payment Assistant v1.11.20 Personal'
          if(!(Test-Path $personalApp)){throw 'v1.11.20 Personal app folder missing'}
          Copy-Item $personalApp 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.20 Personal - Portable Windows',
            '',
            'No Python installation is required. Keep the entire folder together.',
            'Run: Pastel Payment Assistant v1.11.20 Personal.exe',
            '',
            'v1.11.20 recurrence improvement:',
            '- Verified Mary Hartslief variants from the supplied Standard Bank statement are grouped as one recurring payee: MARY HARTSLIEF.',
            '- Changing Immediate Payment bank reference numbers and PCASH/PETTY CASH wording no longer split that recurring payee.',
            '- This affects recurrence grouping/history only; strict automatic-allocation matching remains separate.',
            '- Individual transactions within the recurring payee can still have different manual GL/VAT/description allocations.',
            '- Existing autosaved v1.11.19 sessions recalculate recurrence automatically on launch.',
            '- Existing profiles/rules/settings/history are preserved in the normal v1.x AppData location.',
            '- Receipt sign fix remains included so money into the bank shows positive on Pastel Receipts.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable\README.txt'

          New-Item -ItemType Directory -Force 'desktop\v201rebuild' | Out-Null
          Copy-Item 'desktop\v2.0.1_clean_release.pyw' 'desktop\v201rebuild\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v201rebuild'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v2.0.1 Clean" pastel_payment_assistant.pyw
          $cleanCode=$LASTEXITCODE
          Pop-Location
          if($cleanCode -ne 0){throw 'v2.0.1 Clean PyInstaller build failed'}
          $cleanApp='desktop\v201rebuild\dist\Pastel Payment Assistant v2.0.1 Clean'
          if(!(Test-Path $cleanApp)){throw 'v2.0.1 Clean app folder missing'}
          Copy-Item $cleanApp 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable' -Recurse
          @(
            'Pastel Payment Assistant v2.0.1 Clean - Portable Windows Feedback Build',
            '',
            'No Python installation is required. Keep the entire folder together.',
            'Run: Pastel Payment Assistant v2.0.1 Clean.exe',
            '',
            '- Contains no personal rules, settings, transaction history, profiles or bundled session.',
            '- Uses the isolated PastelPaymentAssistantV2Feedback AppData namespace.',
            '- Includes the Mary Hartslief recurrence grouping improvement and all v1.11.20 core fixes.',
            '- Includes receipt positive-bank sign handling, autosave/resume, strict matching and hover help.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable\README.txt'

          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable.zip' -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable.zip' -Force -ErrorAction SilentlyContinue
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable.zip' -Force
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable' 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable.zip' -Force
          $personalHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          $cleanHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$personalHash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable.sha256.txt'
          "SHA256=$cleanHash" | Set-Content 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable.zip').Length -ge 100MB){throw 'Personal ZIP too large'}
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable.zip').Length -ge 100MB){throw 'Clean ZIP too large'}

      - name: Publish successful packages and stop retries
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $personalHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          $cleanHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.20 Personal and v2.0.1 Clean packages succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "v1.11.20 Personal ZIP SHA256: $personalHash",
            "v2.0.1 Clean ZIP SHA256: $cleanHash",
            'Packaging: PyInstaller --onedir --windowed',
            'Mary Hartslief six-variant recurring identity check: passed',
            'Mary recurrence count x6 check: passed',
            'Individual Mary allocation independence check: passed',
            'Autosaved-session recurrence recalculation check: passed',
            'Recurring history upsert/migration check: passed',
            'Strict allocation matcher remains separate check: passed',
            'Receipt positive Pastel Bank Amount checks: passed',
            'Blank-description STOP ORDER HANDLING FEE checks: passed',
            'Auto and Manual additive selection checks: passed',
            'Grouped UI and hover help checks: passed',
            'Company profile isolation tests: passed',
            'v2.0.1 clean AppData isolation check: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.20_AND_V2.0.1_SUCCESS.txt'
          Remove-Item 'desktop\BUILD_DESKTOP_V1.11.20_AND_V2.0.1_FAILURE.txt' -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\v11120rebuild' -Recurse -Force
          Remove-Item 'desktop\v201rebuild' -Recurse -Force
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.20-Personal-Portable' -Recurse -Force
          Remove-Item 'desktop\Pastel-Payment-Assistant-v2.0.1-Clean-Portable' -Recurse -Force
          Remove-Item 'desktop\v1.11.20_release.pyw' -Force
          Remove-Item 'desktop\v2.0.1_clean_release.pyw' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'desktop/Pastel-Payment-Assistant-v1.11.20-Personal-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.20-Personal-Portable.sha256.txt' 'desktop/Pastel-Payment-Assistant-v2.0.1-Clean-Portable.zip' 'desktop/Pastel-Payment-Assistant-v2.0.1-Clean-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.20_AND_V2.0.1_SUCCESS.txt'
          git rm '.github/workflows/rebuild-v11120-v201-portable.yml'
          git commit -m 'Publish Pastel Payment Assistant v1.11.20 Personal and v2.0.1 Clean [skip ci]'
          git push

      - name: Record failure
        if: failure()
        shell: powershell
        run: |
          @(
            'Pastel Payment Assistant v1.11.20 / v2.0.1 package failed.',
            "run=${{ github.run_id }} attempt=${{ github.run_attempt }}",
            'personal_source=${{ steps.source_personal.outcome }}',
            'clean_source=${{ steps.source_clean.outcome }}',
            'build=${{ steps.build.outcome }}',
            'commit=${{ steps.commit.outcome }}'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.20_AND_V2.0.1_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'desktop/BUILD_DESKTOP_V1.11.20_AND_V2.0.1_FAILURE.txt'
          git commit -m 'Record v1.11.20 / v2.0.1 package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
