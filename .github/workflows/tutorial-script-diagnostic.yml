name: Tutorial script diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tutorial-script-diagnostic.yml'
      - 'desktop/tutorial_ci_diagnostic.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: tutorial-script-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record diagnostic run ID
        shell: powershell
        run: |
          @(
            'Tutorial script diagnostic started.',
            "Run ID: $env:GITHUB_RUN_ID",
            "Attempt: $env:GITHUB_RUN_ATTEMPT",
            "Commit: $env:GITHUB_SHA"
          ) | Set-Content 'desktop\TUTORIAL_SCRIPT_DIAGNOSTIC_START.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'desktop/TUTORIAL_SCRIPT_DIAGNOSTIC_START.txt'
          git commit -m 'Record tutorial script diagnostic run [skip ci]'
          git push origin HEAD:main

      - name: Run tutorial diagnostic script
        id: diagnostic
        continue-on-error: true
        shell: powershell
        run: python desktop/tutorial_ci_diagnostic.py

      - name: Publish diagnostic result and remove workflow
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(!(Test-Path 'desktop\TUTORIAL_SCRIPT_DIAGNOSTIC_RESULT.txt')){
            @(
              'Pastel Payment Assistant tutorial script diagnostic',
              "Run ID: $env:GITHUB_RUN_ID",
              'RESULT: FAILURE',
              'Diagnostic script did not create its result file.'
            ) | Set-Content 'desktop\TUTORIAL_SCRIPT_DIAGNOSTIC_RESULT.txt'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -f 'desktop/TUTORIAL_SCRIPT_DIAGNOSTIC_RESULT.txt'
          git rm '.github/workflows/tutorial-script-diagnostic.yml'
          git commit -m 'Publish tutorial script diagnostic result [skip ci]'
          git push origin main

      - name: Fail run if diagnostic failed
        if: steps.diagnostic.outcome == 'failure'
        shell: powershell
        run: exit 1
