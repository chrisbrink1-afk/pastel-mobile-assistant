name: Publish Pastel Payment Assistant v1.11 Portable Final

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.11-allocation-controls
    paths:
      - '.github/workflows/release-v111-final.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate final v1.11 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src='desktop\v1.11_final.pyw'
          if(!(Test-Path $src)){throw 'v1.11 final source is missing'}
          python -m py_compile $src
          if($LASTEXITCODE -ne 0){throw 'v1.11 source compile failed'}
          python $src --self-test
          if($LASTEXITCODE -ne 0){throw 'v1.11 self-test failed'}
          $text=Get-Content $src -Raw
          @(
            'APP_VERSION = "1.11.0"',
            'Select Auto-Allocated',
            'Correct auto-allocation',
            'Use amount-based allocation rule',
            'Pastel description',
            'Import rules backup…'
          ) | ForEach-Object { if(!$text.Contains($_)){throw "Missing feature marker: $_"} }

      - name: Verify v1.10 rules backup compatibility
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import csv
          import io
          import runpy
          import tempfile
          from pathlib import Path

          ns = runpy.run_path(r'desktop\v1.11_final.pyw', run_name='v111_rules_test')
          Rule = ns['Rule']; Store = ns['Store']
          old_csv = '''direction,name,mode,pattern,account,vat,tax_type,pastel_ref,priority,enabled\nPAYMENT,HOLLARD 0923,SMART,HOLLARD 0923,7100002,1,1,0923,100,1\nRECEIPT,CLIENT ABC,SMART,CLIENT ABC 1234,4000001,0,0,1234,90,1\n'''
          rows = list(csv.DictReader(io.StringIO(old_csv)))
          with tempfile.TemporaryDirectory() as td:
              st = Store(Path(td) / 'rules.db')
              for row in rows:
                  direction=(row.get('direction') or 'PAYMENT').strip().upper()
                  r=Rule(None,row.get('name','').strip(),row.get('mode','SMART').strip(),row.get('pattern','').strip(),row.get('account','').strip(),row.get('vat','0').strip() in {'1','true','True','yes','Yes'},int(row.get('tax_type','0') or 0),row.get('pastel_ref','').strip(),int(row.get('priority','100') or 100),row.get('enabled','1').strip() not in {'0','false','False'},direction,row.get('description','').strip(),row.get('amount_operator','').strip(),row.get('amount_threshold','').strip(),row.get('amount_account','').strip())
                  st.save_rule(r)
              got=st.all_rules()
              assert len(got)==2
              p=next(x for x in got if x.direction=='PAYMENT')
              r=next(x for x in got if x.direction=='RECEIPT')
              assert (p.name,p.pattern,p.account,p.vat,p.tax_type,p.pastel_ref,p.priority)==('HOLLARD 0923','HOLLARD 0923','7100002',True,1,'0923',100)
              assert (r.name,r.pattern,r.account,r.vat,r.pastel_ref,r.priority)==('CLIENT ABC','CLIENT ABC 1234','4000001',False,'1234',90)
              assert p.description=='' and p.amount_operator=='' and p.amount_account==''
              st.conn.close()
          print('v1.10 rules backup compatibility passed')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'v1.10 rules compatibility failed'}

      - name: Build portable v1.11 exactly like v1.10
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}
          New-Item -ItemType Directory -Force 'desktop\v111finalrelease' | Out-Null
          Copy-Item 'desktop\v1.11_final.pyw' 'desktop\v111finalrelease\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v111finalrelease'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11" pastel_payment_assistant.pyw
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v111finalrelease\dist\Pastel Payment Assistant v1.11'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'Pastel-Payment-Assistant-v1.11-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.exe',
            '',
            'New in v1.11:',
            '- Custom Pastel descriptions for rules and one-off transactions.',
            '- Optional amount-based account allocation rules.',
            '- Select Auto-Allocated.',
            '- Correct false auto-allocations and optionally update the saved rule.',
            '- v1.10 rules-backup CSV files import directly into v1.11.',
            '',
            'Portable build method matches v1.10: PyInstaller onedir/windowed; no installer and no Python installation required.',
            'The Cash Book bank GL remains the batch-level Pastel import column L setting.',
            '',
            'If corporate endpoint security blocks the application, ask IT/security to review or allow it rather than disabling security controls.'
          ) | Set-Content 'Pastel-Payment-Assistant-v1.11-Portable\README.txt'
          Compress-Archive 'Pastel-Payment-Assistant-v1.11-Portable' 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Force
          $hash=(Get-FileHash 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'Pastel-Payment-Assistant-v1.11-Portable.sha256.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: Pastel-Payment-Assistant-v1.11-Portable-Windows-Final
          path: |
            Pastel-Payment-Assistant-v1.11-Portable.zip
            Pastel-Payment-Assistant-v1.11-Portable.sha256.txt

      - name: Publish fresh v1.11 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create desktop-v1.11-portable-final Pastel-Payment-Assistant-v1.11-Portable.zip Pastel-Payment-Assistant-v1.11-Portable.sha256.txt --title "Pastel Payment Assistant v1.11 - Portable Windows" --notes "Portable Windows v1.11 built with the same PyInstaller onedir/windowed method as the working v1.10 portable build. Adds transaction descriptions, amount-based GL allocation, Select Auto-Allocated, correction of false auto-allocations, and verified v1.10 rules-backup compatibility."
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}

      - name: Record success
        shell: powershell
        run: |
          $hash=(Get-FileHash 'Pastel-Payment-Assistant-v1.11-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11 portable Windows FINAL release succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'v1.10 rules backup compatibility: passed',
            'Portable packaging matches v1.10: PyInstaller --onedir --windowed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11_FINAL_SUCCESS.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11_FINAL_SUCCESS.txt'
          git commit -m 'Mark v1.11 final portable release successful [skip ci]'
          git push
