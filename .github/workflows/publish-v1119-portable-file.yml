name: Publish Pastel Payment Assistant v1.11.9 Portable

on:
  workflow_dispatch:
  schedule:
    - cron: '25 18 22 8 *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1119-portable-file.yml'
      - 'desktop/v1.11.9_visible_rule_assignment_transform.py'

permissions:
  contents: write

jobs:
  publish-file:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and test v1.11.9 source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.9_release.pyw' -Encoding utf8
          python 'desktop\v1.11.1_strict_match_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.1 transform failed'}
          python 'desktop\v1.11.2_global_match_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.2 transform failed'}
          python 'desktop\v1.11.3_amount_description_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.3 transform failed'}
          python 'desktop\v1.11.4_amount_review_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.4 transform failed'}
          python 'desktop\v1.11.5_sequential_reference_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.5 transform failed'}
          python 'desktop\v1.11.6_profiles_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.6 transform failed'}
          python 'desktop\v1.11.7_multi_review_assignment_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.7 transform failed'}
          python 'desktop\v1.11.8_pre_remove_main_review_method.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.8 pre-transform failed'}
          python 'desktop\v1.11.8_rule_dialog_review_table_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.8 transform failed'}
          python 'desktop\v1.11.9_visible_rule_assignment_transform.py' 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.9 transform failed'}
          python -m py_compile 'desktop\v1.11.9_release.pyw'; if($LASTEXITCODE -ne 0){throw 'compile failed'}
          python 'desktop\v1.11.9_release.pyw' --self-test; if($LASTEXITCODE -ne 0){throw 'self-test failed'}
          $src=Get-Content 'desktop\v1.11.9_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.9"')){throw 'Version marker missing'}
          if(!$src.Contains('Transactions caught by this amount condition')){throw 'Embedded review table missing'}
          if(!$src.Contains('Tick the transactions to allocate, then:')){throw 'Visible allocation toolbar missing'}
          if(!$src.Contains('amount_review_assign_button')){throw 'Visible Assign selected button missing'}
          if(!$src.Contains('Assign selected ({selected_count})')){throw 'Selected-count button feedback missing'}
          if($src.Contains('"review": "Allocate"')){throw 'Old main-screen Allocate column remains'}
          if($src.Contains('text="Assign selected review items"')){throw 'Old main review button remains'}
          if(!$src.Contains('Company profile:')){throw 'Profiles missing'}
          if(!$src.Contains('assign_monthly_sequential_references')){throw 'Sequential refs missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Strict matching missing'}

      - name: Build portable Windows app
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}
          New-Item -ItemType Directory -Force 'desktop\v1119repo' | Out-Null
          Copy-Item 'desktop\v1.11.9_release.pyw' 'desktop\v1119repo\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v1119repo'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.9" pastel_payment_assistant.pyw
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v1119repo\dist\Pastel Payment Assistant v1.11.9'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.9 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.9.exe',
            '',
            'v1.11.9 fix:',
            '- In the Rule window, Review each qualifying transaction still shows the matching payment/receipt table.',
            '- The Assign selected control is now in an always-visible toolbar ABOVE that table.',
            '- Tick one or many transactions; the button shows the number selected.',
            '- Click Assign selected to choose the GL/description/VAT for exactly those rows.',
            '- Example: select 3 rows and allocate PETROL, then select a different row and allocate SURVEY.',
            '- Unselected qualifying transactions stay untouched.',
            '',
            'Retains company profiles, unique monthly Pastel references, amount descriptions, and strict allocation matching.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable\README.txt'
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip').Length -ge 100MB){throw 'Portable ZIP too large'}

      - name: Commit successful package
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable' -Recurse -Force
          Remove-Item 'desktop\v1119repo' -Recurse -Force
          Remove-Item 'desktop\v1.11.9_release.pyw' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.9-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.9 portable package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed (same method as v1.10)',
            'Always-visible Rule-window Assign selected toolbar check: passed',
            'Embedded amount-review table tests: passed',
            'Grouped PETROL/SURVEY allocation tests: passed',
            'Company profile isolation tests: passed',
            'Monthly sequential and same-date unique-reference tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.9_VISIBLE_ASSIGN_SUCCESS.txt'
          Remove-Item 'desktop\BUILD_DESKTOP_V1.11.9_VISIBLE_ASSIGN_FAILURE.txt' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A 'desktop/Pastel-Payment-Assistant-v1.11.9-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.9-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.9_VISIBLE_ASSIGN_SUCCESS.txt' 'desktop/BUILD_DESKTOP_V1.11.9_VISIBLE_ASSIGN_FAILURE.txt'
          git commit -m 'Publish Pastel Payment Assistant v1.11.9 portable [skip ci]'
          git push

      - name: Record failure
        if: failure()
        shell: powershell
        run: |
          @(
            'Pastel Payment Assistant v1.11.9 package failed.',
            'source=${{ steps.source.outcome }}',
            'build=${{ steps.build.outcome }}',
            'commit=${{ steps.commit.outcome }}'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.9_VISIBLE_ASSIGN_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11.9_VISIBLE_ASSIGN_FAILURE.txt'
          git commit -m 'Record v1.11.9 package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
