name: Rebuild Pastel Payment Assistant v1.11.21 Personal and v2.1 Clean UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-v11121-v21-ui-portable.yml'
      - 'desktop/v1.11.21_modern_classic_ui_transform.py'
      - 'desktop/v2.1_clean_feedback_transform.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pastel-v11121-v21-ui-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and test v1.11.21 Personal source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.21_release.pyw' -Encoding utf8
          $transforms = @(
            'v1.11.1_strict_match_transform.py',
            'v1.11.2_global_match_transform.py',
            'v1.11.3_amount_description_transform.py',
            'v1.11.4_amount_review_transform.py',
            'v1.11.5_sequential_reference_transform.py',
            'v1.11.6_profiles_transform.py',
            'v1.11.7_multi_review_assignment_transform.py',
            'v1.11.8_pre_remove_main_review_method.py',
            'v1.11.8_rule_dialog_review_table_transform.py',
            'v1.11.9_visible_rule_assignment_transform.py',
            'v1.11.10_resizable_rule_dialog_transform.py',
            'v1.11.11_scrollable_rule_dialog_transform.py',
            'v1.11.12_rule_edits_stay_auto_transform.py',
            'v1.11.13_select_manual_allocations_transform.py',
            'v1.11.14_additive_allocation_selection_transform.py',
            'v1.11.15_user_friendly_help_transform.py',
            'v1.11.16_recurring_identity_apply_transform.py',
            'v1.11.17_blank_details_identity_transform.py',
            'v1.11.18_receipt_bank_sign_transform.py',
            'v1.11.19_autosave_session_transform.py',
            'v1.11.20_recurring_payee_identity_transform.py',
            'v1.11.21_modern_classic_ui_transform.py'
          )
          foreach($t in $transforms){
            python (Join-Path 'desktop' $t) 'desktop\v1.11.21_release.pyw'
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }
          python -m py_compile 'desktop\v1.11.21_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.21 compile failed'}
          python 'desktop\v1.11.21_release.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'v1.11.21 self-test failed'}
          $src=Get-Content 'desktop\v1.11.21_release.pyw' -Raw
          $required = @(
            'APP_VERSION = "1.11.21"',
            'DEFAULT_UI_MODE = "modern"',
            'UI_MODES = {"modern", "classic"}',
            'def _build_dashboard(self):',
            'def _navigate_modern(self, key: str):',
            'def toggle_ui_mode(self):',
            'def _apply_ui_mode(self, mode: str = None, initial: bool = False):',
            '"modern_page": getattr(self, "current_modern_page", "")',
            'Classic UI',
            'Overview',
            'APP_DATA_NAMESPACE = "PastelPaymentAssistant"',
            'ALLOW_BUNDLED_RULE_BOOTSTRAP = True',
            'signed_gross = -gross if direction == "RECEIPT" else gross',
            'canonical and p == canonical',
            'def recurring_identity_key',
            'MARY HARTSLIEF',
            'Existing manual selections were preserved',
            'Existing automatic selections were preserved',
            'class HoverHelp',
            'SESSION_SETTING_KEY = "__autosaved_session_v1"',
            'Company profile:',
            'GLOBAL SAFETY GATE'
          )
          foreach($marker in $required){ if(!$src.Contains($marker)){ throw "Missing Personal source marker: $marker" } }

      - name: Prepare and test v2.1 Clean source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item 'desktop\v1.11.21_release.pyw' 'desktop\v2.1_clean_release.pyw' -Force
          python 'desktop\v2.1_clean_feedback_transform.py' 'desktop\v2.1_clean_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v2.1 clean transform failed'}
          python -m py_compile 'desktop\v2.1_clean_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v2.1 compile failed'}
          python 'desktop\v2.1_clean_release.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'v2.1 self-test failed'}
          $src=Get-Content 'desktop\v2.1_clean_release.pyw' -Raw
          $required = @(
            'APP_VERSION = "2.1"',
            'APP_DATA_NAMESPACE = "PastelPaymentAssistantV2Feedback"',
            'APP_DATA_FALLBACK = ".pastel_payment_assistant_v2_feedback"',
            'CLEAN_FEEDBACK_BUILD = True',
            'ALLOW_BUNDLED_RULE_BOOTSTRAP = False',
            'DEFAULT_UI_MODE = "modern"',
            'def _build_dashboard(self):',
            'def toggle_ui_mode(self):',
            'Classic UI',
            'Clean feedback workspace',
            'signed_gross = -gross if direction == "RECEIPT" else gross',
            'def recurring_identity_key',
            'GLOBAL SAFETY GATE'
          )
          foreach($marker in $required){ if(!$src.Contains($marker)){ throw "Missing Clean source marker: $marker" } }

      - name: Build portable Windows apps
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller install failed'}

          Remove-Item 'desktop\v11121build' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\v21build' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'desktop\v11121build' | Out-Null
          New-Item -ItemType Directory -Force 'desktop\v21build' | Out-Null

          Copy-Item 'desktop\v1.11.21_release.pyw' 'desktop\v11121build\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v11121build'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.21 Personal" pastel_payment_assistant.pyw
          $personalCode=$LASTEXITCODE
          Pop-Location
          if($personalCode -ne 0){throw 'v1.11.21 Personal PyInstaller build failed'}
          Copy-Item 'desktop\v11121build\dist\Pastel Payment Assistant v1.11.21 Personal' 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.21 Personal - Portable Windows',
            '',
            'No Python installation is required. Keep the entire folder together.',
            'Run: Pastel Payment Assistant v1.11.21 Personal.exe',
            '',
            'UI:',
            '- Modern accounting-dashboard UI is the default.',
            '- Overview gives first-time users a guided five-step workflow and live statement cards.',
            '- Left navigation provides Payments, Receipts, Recurring, Rules and Settings.',
            '- Use Classic UI at the top-right to return to the familiar previous tabbed layout at any time.',
            '- Modern and Classic use exactly the same company profiles, rules, settings, history and autosaved session.',
            '',
            'Compatibility:',
            '- Uses the existing PastelPaymentAssistant AppData location and preserves v1.11.20 Personal data.',
            '- Receipt positive-bank-amount fix remains included.',
            '- STOP ORDER HANDLING FEE blank-description fix remains included.',
            '- Mary Hartslief recurring-payee grouping remains included.',
            '- Auto + Manual export quick-selection remains additive.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable\README.txt'

          Copy-Item 'desktop\v2.1_clean_release.pyw' 'desktop\v21build\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v21build'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v2.1 Clean" pastel_payment_assistant.pyw
          $cleanCode=$LASTEXITCODE
          Pop-Location
          if($cleanCode -ne 0){throw 'v2.1 Clean PyInstaller build failed'}
          Copy-Item 'desktop\v21build\dist\Pastel Payment Assistant v2.1 Clean' 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable' -Recurse
          @(
            'Pastel Payment Assistant v2.1 Clean - Portable Windows Feedback Build',
            '',
            'No Python installation is required. Keep the entire folder together.',
            'Run: Pastel Payment Assistant v2.1 Clean.exe',
            '',
            'UI:',
            '- Modern accounting-dashboard UI is the default for first-time users.',
            '- Overview provides guided next steps and live statement cards.',
            '- Classic UI remains available from the top-right switch.',
            '',
            'Clean/shareable behavior:',
            '- Contains no personal rules, settings, transaction history, company profiles or saved session.',
            '- Uses the isolated PastelPaymentAssistantV2Feedback AppData location.',
            '- Does not read or modify a v1.x Personal installation.',
            '- Private bundled-rule bootstrap is disabled.',
            '- New users can create their own profiles/rules/settings and their own sessions autosave normally.',
            '',
            'Accounting behavior:',
            '- Same receipt-sign, recurring-payee, strict-matching, additive-selection and validation fixes as Personal.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable\README.txt'

          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable.zip' -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable.zip' -Force -ErrorAction SilentlyContinue
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable.zip' -Force
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable' 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable.zip' -Force
          $personalHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          $cleanHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$personalHash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable.sha256.txt'
          "SHA256=$cleanHash" | Set-Content 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable.zip').Length -ge 100MB){throw 'Personal ZIP too large'}
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable.zip').Length -ge 100MB){throw 'Clean ZIP too large'}

      - name: Publish successful packages
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $personalHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.21-Personal-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          $cleanHash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v2.1-Clean-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.21 Personal and v2.1 Clean packages succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "v1.11.21 Personal ZIP SHA256: $personalHash",
            "v2.1 Clean ZIP SHA256: $cleanHash",
            'Packaging: PyInstaller --onedir --windowed',
            'Modern dashboard default UI check: passed',
            'Classic previous-layout compatibility check: passed',
            'Modern/Classic same-data compatibility check: passed',
            'Overview guided workflow source checks: passed',
            'Autosave modern-page restore check: passed',
            'Personal existing AppData compatibility check: passed',
            'v2.1 Clean isolated AppData namespace check: passed',
            'Receipt positive Pastel Bank Amount checks: passed',
            'Blank-description STOP ORDER HANDLING FEE checks: passed',
            'Mary Hartslief recurring identity checks: passed',
            'Auto and Manual additive selection checks: passed',
            'Grouped UI and hover help checks: passed',
            'Resizable and scrollable Rule dialog checks: passed',
            'Company profile isolation tests: passed',
            'Monthly sequential reference tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.21_AND_V2.1_SUCCESS.txt'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -f 'desktop/Pastel-Payment-Assistant-v1.11.21-Personal-Portable.zip'
          git add -f 'desktop/Pastel-Payment-Assistant-v1.11.21-Personal-Portable.sha256.txt'
          git add -f 'desktop/Pastel-Payment-Assistant-v2.1-Clean-Portable.zip'
          git add -f 'desktop/Pastel-Payment-Assistant-v2.1-Clean-Portable.sha256.txt'
          git add -f 'desktop/BUILD_DESKTOP_V1.11.21_AND_V2.1_SUCCESS.txt'
          git rm '.github/workflows/rebuild-v11121-v21-ui-portable.yml'
          git commit -m 'Publish Pastel Payment Assistant v1.11.21 Personal and v2.1 Clean UI [skip ci]'
          git push origin main
