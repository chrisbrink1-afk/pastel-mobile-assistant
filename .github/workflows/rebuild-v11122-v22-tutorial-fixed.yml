name: Rebuild v1.11.22 Personal and v2.2 Clean Tutorial Fixed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-v11122-v22-tutorial-fixed.yml'
      - 'desktop/tutorial_ci_diagnostic.py'
      - 'desktop/v1.11.22_adaptive_tutorial_transform.py'
      - 'desktop/v1.11.22_tutorial_classic_restore_transform.py'
      - 'desktop/v2.2_clean_feedback_transform.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pastel-v11122-v22-tutorial-fixed
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record release run ID
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @(
            'Pastel Payment Assistant v1.11.22 / v2.2 corrected release started.',
            "Run ID: $env:GITHUB_RUN_ID",
            "Attempt: $env:GITHUB_RUN_ATTEMPT",
            "Commit: $env:GITHUB_SHA"
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.22_AND_V2.2_START.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'desktop/BUILD_DESKTOP_V1.11.22_AND_V2.2_START.txt'
          git commit -m 'Record v1.11.22 v2.2 corrected release run [skip ci]'
          git push origin HEAD:main

      - name: Run source and Windows tutorial UI regression suite
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python desktop/tutorial_ci_diagnostic.py
          if($LASTEXITCODE -ne 0){ throw 'Tutorial diagnostic/regression suite failed' }
          $diag=Get-Content 'desktop\TUTORIAL_SCRIPT_DIAGNOSTIC_RESULT.txt' -Raw
          if(!$diag.Contains('RESULT: SUCCESS')){ throw 'Tutorial diagnostic did not report success' }
          if(!$diag.Contains('Personal tutorial UI smoke: success')){ throw 'Personal tutorial UI smoke missing' }
          if(!$diag.Contains('Clean tutorial UI smoke: success')){ throw 'Clean tutorial UI smoke missing' }

      - name: Install PyInstaller
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){ throw 'PyInstaller install failed' }

      - name: Build portable Windows applications
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $personalFolder='desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable'
          $cleanFolder='desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable'
          Remove-Item $personalFolder -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $cleanFolder -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\build_v11122' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\build_v22' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'desktop\build_v11122' | Out-Null
          New-Item -ItemType Directory -Force 'desktop\build_v22' | Out-Null

          Copy-Item 'desktop\diag_v11122_personal.pyw' 'desktop\build_v11122\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\build_v11122'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.22 Personal" pastel_payment_assistant.pyw
          $personalExit=$LASTEXITCODE
          Pop-Location
          if($personalExit -ne 0){ throw 'Personal PyInstaller build failed' }
          Copy-Item 'desktop\build_v11122\dist\Pastel Payment Assistant v1.11.22 Personal' $personalFolder -Recurse

          Copy-Item 'desktop\diag_v22_clean.pyw' 'desktop\build_v22\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\build_v22'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v2.2 Clean" pastel_payment_assistant.pyw
          $cleanExit=$LASTEXITCODE
          Pop-Location
          if($cleanExit -ne 0){ throw 'Clean PyInstaller build failed' }
          Copy-Item 'desktop\build_v22\dist\Pastel Payment Assistant v2.2 Clean' $cleanFolder -Recurse

          @(
            'Pastel Payment Assistant v1.11.22 Personal - Portable Windows',
            '',
            'Run: Pastel Payment Assistant v1.11.22 Personal.exe',
            'No Python installation is required. Keep the entire extracted folder together.',
            '',
            'Tutorial & Help:',
            '- Opens automatically only for a genuinely new/empty workspace.',
            '- Existing Personal users are not forced through onboarding.',
            '- Skip, Back, Next and Finish are available.',
            '- Re-scan my progress adapts the tutorial to current settings, rules and statement progress.',
            '- Search accepts normal problem terms such as orange transaction, wrong GL, VAT, recurring missing, receipt negative, export and autosave.',
            '- Tutorial & Help can be launched at any time from Modern or Classic UI.',
            '- Launching from Classic temporarily uses Modern guidance and returns to Classic when closed.',
            '',
            'Compatibility:',
            '- Uses existing PastelPaymentAssistant AppData and preserves Personal profiles/rules/settings/history/session.',
            '- Modern UI is default; Classic previous UI remains available.',
            '- Receipt sign, blank-description STOP ORDER, Mary Hartslief recurrence, additive selection, strict matching and autosave fixes are retained.'
          ) | Set-Content "$personalFolder\README.txt"

          @(
            'Pastel Payment Assistant v2.2 Clean - Portable Windows Feedback Build',
            '',
            'Run: Pastel Payment Assistant v2.2 Clean.exe',
            'No Python installation is required. Keep the entire extracted folder together.',
            '',
            'Clean/shareable behavior:',
            '- Contains no personal rules, settings, history, profiles or saved session.',
            '- Uses isolated PastelPaymentAssistantV2Feedback AppData.',
            '- Does not read or modify the Personal installation.',
            '- Modern and Classic UI are both included.',
            '',
            'Tutorial & Help:',
            '- Opens automatically in a genuinely new Clean workspace.',
            '- Can be skipped and rerun at any time.',
            '- Adapts to current progress and includes searchable troubleshooting help.'
          ) | Set-Content "$cleanFolder\README.txt"

      - name: Package, checksum and create success marker
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $personalZip='desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable.zip'
          $cleanZip='desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable.zip'
          Remove-Item $personalZip -Force -ErrorAction SilentlyContinue
          Remove-Item $cleanZip -Force -ErrorAction SilentlyContinue
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable' $personalZip -Force
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable' $cleanZip -Force
          $personalHash=(Get-FileHash $personalZip -Algorithm SHA256).Hash.ToLower()
          $cleanHash=(Get-FileHash $cleanZip -Algorithm SHA256).Hash.ToLower()
          "SHA256=$personalHash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.22-Personal-Portable.sha256.txt'
          "SHA256=$cleanHash" | Set-Content 'desktop\Pastel-Payment-Assistant-v2.2-Clean-Portable.sha256.txt'

          $diag=Get-Content 'desktop\TUTORIAL_SCRIPT_DIAGNOSTIC_RESULT.txt' -Raw
          if(!$diag.Contains('RESULT: SUCCESS')){ throw 'Cannot publish because diagnostic did not pass' }
          @(
            'Pastel Payment Assistant v1.11.22 Personal and v2.2 Clean portable packages succeeded.',
            "Source/build commit: $env:GITHUB_SHA",
            "GitHub Actions run ID: $env:GITHUB_RUN_ID",
            "Personal ZIP SHA256: $personalHash",
            "Clean ZIP SHA256: $cleanHash",
            'Packaging: PyInstaller --onedir --windowed',
            'Personal transform/compile/self-test: passed',
            'Clean transform/compile/self-test: passed',
            'Personal tutorial Windows UI smoke: passed',
            'Clean tutorial Windows UI smoke: passed',
            'Adaptive tutorial path check: passed',
            'Searchable help query checks: passed',
            'Modern to Classic to Modern navigation check: passed',
            'Classic tutorial return-to-Classic check: passed',
            'Autosave/session check: passed',
            'Personal AppData backward-compatibility check: passed',
            'Clean AppData isolation check: passed',
            'Receipt positive Pastel Bank Amount regression: passed',
            'Blank-description STOP ORDER regression: passed',
            'Mary Hartslief recurring-payee regression: passed',
            'Additive Auto and Manual selection regressions: passed',
            'Strict allocation matching regressions: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.22_AND_V2.2_TUTORIAL_SUCCESS.txt'

      - name: Publish verified packages
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -f `
            'desktop/Pastel-Payment-Assistant-v1.11.22-Personal-Portable.zip' `
            'desktop/Pastel-Payment-Assistant-v1.11.22-Personal-Portable.sha256.txt' `
            'desktop/Pastel-Payment-Assistant-v2.2-Clean-Portable.zip' `
            'desktop/Pastel-Payment-Assistant-v2.2-Clean-Portable.sha256.txt' `
            'desktop/BUILD_DESKTOP_V1.11.22_AND_V2.2_TUTORIAL_SUCCESS.txt' `
            'desktop/TUTORIAL_SCRIPT_DIAGNOSTIC_RESULT.txt'
          git rm '.github/workflows/rebuild-v11122-v22-tutorial-fixed.yml'
          git commit -m 'Publish v1.11.22 Personal and v2.2 Clean tutorial builds [skip ci]'
          git push origin main

      - name: Publish failure marker
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          @(
            'Pastel Payment Assistant v1.11.22 / v2.2 corrected tutorial build FAILED.',
            "Run ID: $env:GITHUB_RUN_ID",
            "Attempt: $env:GITHUB_RUN_ATTEMPT",
            "Commit: $env:GITHUB_SHA",
            'Inspect the failed GitHub Actions job log before retrying.'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.22_AND_V2.2_TUTORIAL_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -f 'desktop/BUILD_DESKTOP_V1.11.22_AND_V2.2_TUTORIAL_FAILURE.txt' 'desktop/TUTORIAL_SCRIPT_DIAGNOSTIC_RESULT.txt'
          git commit -m 'Record v1.11.22 v2.2 corrected tutorial build failure [skip ci]'
          git push origin main
