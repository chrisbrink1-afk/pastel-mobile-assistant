name: Publish Pastel Payment Assistant v1.11.3 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1113-portable-file.yml'
      - 'desktop/v1.11.3_amount_description_transform.py'
      - 'desktop/v1.11.2_global_match_transform.py'
      - 'desktop/v1.11.1_strict_match_transform.py'

permissions:
  contents: write

jobs:
  publish-file:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare v1.11.3 source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.3_release.pyw' -Encoding utf8
          python 'desktop\v1.11.1_strict_match_transform.py' 'desktop\v1.11.3_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.1 strict-match transform failed'}
          python 'desktop\v1.11.2_global_match_transform.py' 'desktop\v1.11.3_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.2 global safety transform failed'}
          python 'desktop\v1.11.3_amount_description_transform.py' 'desktop\v1.11.3_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.3 amount-description transform failed'}
          python -m py_compile 'desktop\v1.11.3_release.pyw'
          if($LASTEXITCODE -ne 0){throw 'v1.11.3 compile failed'}
          python 'desktop\v1.11.3_release.pyw' --self-test
          if($LASTEXITCODE -ne 0){throw 'v1.11.3 self-test failed'}
          $src=Get-Content 'desktop\v1.11.3_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.3"')){throw 'Version marker missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Global allocation safety gate missing'}
          if(!$src.Contains('amount_description')){throw 'Alternative amount description field missing'}
          if(!$src.Contains('Small payment description')){throw 'Alternative description regression test missing'}

      - name: Build portable package like v1.10
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}
          New-Item -ItemType Directory -Force 'desktop\v1113repo' | Out-Null
          Copy-Item 'desktop\v1.11.3_release.pyw' 'desktop\v1113repo\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v1113repo'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.3" pastel_payment_assistant.pyw
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v1113repo\dist\Pastel Payment Assistant v1.11.3'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.3 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.3.exe',
            '',
            'Built using the same PyInstaller --onedir --windowed packaging method as v1.10.',
            'Existing v1.10/v1.11 rules and rule-backup CSV files remain compatible.',
            '',
            'v1.11.3 amount-based allocation description:',
            '- Amount-based allocation rules can now have an Alternative description.',
            '- When the amount condition is met, both the alternative GL and alternative Pastel description are used.',
            '- Leave Alternative description blank to use the normal rule description.',
            '- When the condition is not met, the normal GL and normal description are used.',
            '- Rule backup/export includes the new alternative description field.',
            '- v1.11.2 global strict name/reference allocation safety remains enabled for all payments and receipts.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable\README.txt'
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable.zip').Length -ge 100MB){throw 'Portable ZIP too large'}

      - name: Commit portable ZIP to main
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable' -Recurse -Force
          Remove-Item 'desktop\v1113repo' -Recurse -Force
          Remove-Item 'desktop\v1.11.3_release.pyw' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.3-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.3 portable package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed (same method as v1.10)',
            'Alternative amount-based description tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.3_AMOUNT_DESCRIPTION_SUCCESS.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/Pastel-Payment-Assistant-v1.11.3-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.3-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.3_AMOUNT_DESCRIPTION_SUCCESS.txt'
          git commit -m 'Publish Pastel Payment Assistant v1.11.3 portable [skip ci]'
          git push

      - name: Record failure status
        if: failure()
        shell: powershell
        run: |
          @(
            'Pastel Payment Assistant v1.11.3 package failed.',
            'source=${{ steps.source.outcome }}',
            'build=${{ steps.build.outcome }}',
            'commit=${{ steps.commit.outcome }}'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.3_AMOUNT_DESCRIPTION_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11.3_AMOUNT_DESCRIPTION_FAILURE.txt'
          git commit -m 'Record v1.11.3 package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
