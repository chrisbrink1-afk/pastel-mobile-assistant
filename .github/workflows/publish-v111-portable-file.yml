name: Publish v1.11 Portable ZIP In Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v111-portable-file.yml'

permissions:
  contents: write

jobs:
  publish-file:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch tested v1.11 source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11_repo_release.pyw' -Encoding utf8
          $src='desktop\v1.11_repo_release.pyw'
          python -m py_compile $src
          if($LASTEXITCODE -ne 0){throw 'v1.11 compile failed'}
          python $src --self-test
          if($LASTEXITCODE -ne 0){throw 'v1.11 self-test failed'}

      - name: Build portable package like v1.10
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}
          New-Item -ItemType Directory -Force 'desktop\v111repo' | Out-Null
          Copy-Item 'desktop\v1.11_repo_release.pyw' 'desktop\v111repo\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v111repo'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11" pastel_payment_assistant.pyw
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v111repo\dist\Pastel Payment Assistant v1.11'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.exe',
            '',
            'Built using the same PyInstaller --onedir --windowed packaging method as v1.10.',
            'v1.10 rules-backup CSV files import directly into v1.11.',
            'New: descriptions, amount-based allocation, Select Auto-Allocated, and correction of false auto-allocations.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11-Portable\README.txt'
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11-Portable' 'desktop\Pastel-Payment-Assistant-v1.11-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11-Portable.sha256.txt'
          $size=(Get-Item 'desktop\Pastel-Payment-Assistant-v1.11-Portable.zip').Length
          if($size -ge 100MB){throw "Portable ZIP is too large for direct repository publishing: $size bytes"}

      - name: Commit portable ZIP to main
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11-Portable' -Recurse -Force
          Remove-Item 'desktop\v111repo' -Recurse -Force
          Remove-Item 'desktop\v1.11_repo_release.pyw' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11 portable repository package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed (same method as v1.10)'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11_REPO_PACKAGE_SUCCESS.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/Pastel-Payment-Assistant-v1.11-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11_REPO_PACKAGE_SUCCESS.txt'
          git commit -m 'Publish Pastel Payment Assistant v1.11 portable ZIP [skip ci]'
          git push

      - name: Record failure status
        if: failure()
        shell: powershell
        run: |
          $lines=@(
            'Pastel Payment Assistant v1.11 repository package failed.',
            'source=${{ steps.source.outcome }}',
            'build=${{ steps.build.outcome }}',
            'commit=${{ steps.commit.outcome }}'
          )
          $lines | Set-Content 'desktop\BUILD_DESKTOP_V1.11_REPO_PACKAGE_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.11_REPO_PACKAGE_FAILURE.txt'
          git commit -m 'Record v1.11 repository package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
