name: Scheduled v1.11.21 and v2.1 Windows UI smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pastel-v11121-v21-ui-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recreate sources
        id: recreate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\ui_smoke_personal.pyw' -Encoding utf8
          $transforms=@('v1.11.1_strict_match_transform.py','v1.11.2_global_match_transform.py','v1.11.3_amount_description_transform.py','v1.11.4_amount_review_transform.py','v1.11.5_sequential_reference_transform.py','v1.11.6_profiles_transform.py','v1.11.7_multi_review_assignment_transform.py','v1.11.8_pre_remove_main_review_method.py','v1.11.8_rule_dialog_review_table_transform.py','v1.11.9_visible_rule_assignment_transform.py','v1.11.10_resizable_rule_dialog_transform.py','v1.11.11_scrollable_rule_dialog_transform.py','v1.11.12_rule_edits_stay_auto_transform.py','v1.11.13_select_manual_allocations_transform.py','v1.11.14_additive_allocation_selection_transform.py','v1.11.15_user_friendly_help_transform.py','v1.11.16_recurring_identity_apply_transform.py','v1.11.17_blank_details_identity_transform.py','v1.11.18_receipt_bank_sign_transform.py','v1.11.19_autosave_session_transform.py','v1.11.20_recurring_payee_identity_transform.py','v1.11.21_modern_classic_ui_transform.py')
          foreach($t in $transforms){python (Join-Path 'desktop' $t) 'desktop\ui_smoke_personal.pyw';if($LASTEXITCODE -ne 0){throw "$t failed"}}
          Copy-Item 'desktop\ui_smoke_personal.pyw' 'desktop\ui_smoke_clean.pyw' -Force
          python 'desktop\v2.1_clean_feedback_transform.py' 'desktop\ui_smoke_clean.pyw'
          if($LASTEXITCODE -ne 0){throw 'clean transform failed'}
      - name: Exercise Modern and Classic UI
        id: ui
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
import importlib.util, os, tempfile
from pathlib import Path

def load(path,name,root):
    os.environ['APPDATA']=str(root)
    spec=importlib.util.spec_from_file_location(name,path)
    if spec is None or spec.loader is None: raise RuntimeError('No loader for '+path)
    mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod

def check(path,name):
    with tempfile.TemporaryDirectory() as td:
        mod=load(path,name,Path(td))
        app=mod.App(); app.withdraw(); app.update_idletasks()
        assert app.ui_mode=='modern'
        assert app.modern_header.winfo_manager()=='pack'
        assert app.sidebar.winfo_manager()=='pack'
        app._navigate_modern('dashboard'); app.update_idletasks(); assert app.dashboard_frame.winfo_manager()=='pack'
        for key,tab in [('payments',app.pay_tab),('receipts',app.receipt_tab),('recurring_payments',app.recurring_pay_tab),('recurring_receipts',app.recurring_receipt_tab),('rules',app.rule_tab),('settings',app.settings_tab)]:
            app._navigate_modern(key); app.update_idletasks(); assert app.notebook.select()==str(tab)
        app._apply_ui_mode('classic'); app.update_idletasks()
        assert app.classic_toolbar.winfo_manager()=='pack' and app.sidebar.winfo_manager()==''
        app._apply_ui_mode('modern'); app.update_idletasks()
        assert app.modern_header.winfo_manager()=='pack' and app.sidebar.winfo_manager()=='pack'
        app._show_modern_dashboard(); app._refresh_dashboard(); assert app._save_session()
        app.destroy()

check(r'desktop\ui_smoke_personal.pyw','personal_ui')
check(r'desktop\ui_smoke_clean.pyw','clean_ui')
print('UI smoke passed')
'@ | Set-Content 'desktop\ui_smoke.py'
          python 'desktop\ui_smoke.py'
          if($LASTEXITCODE -ne 0){throw 'UI smoke failed'}
      - name: Record failure
        if: failure()
        shell: powershell
        run: |
          @('UI smoke failed.',"Run ID: $env:GITHUB_RUN_ID","Commit: $env:GITHUB_SHA",'Inspect the run logs for traceback.') | Set-Content 'desktop\BUILD_DESKTOP_V1.11.21_AND_V2.1_UI_SMOKE_FAILURE.txt'
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add -f 'desktop/BUILD_DESKTOP_V1.11.21_AND_V2.1_UI_SMOKE_FAILURE.txt'
          git commit -m 'Record v1.11.21 v2.1 UI smoke failure [skip ci]' 2>$null
          if($LASTEXITCODE -eq 0){git push origin main}
      - name: Record success and stop smoke retries
        if: success()
        shell: powershell
        run: |
          @('Pastel Payment Assistant v1.11.21 Personal and v2.1 Clean Windows UI smoke test succeeded.',"Run ID: $env:GITHUB_RUN_ID","Validation commit: $env:GITHUB_SHA",'Personal App instantiation: passed','Clean App instantiation: passed','Modern default dashboard: passed','Sidebar navigation through all sections: passed','Modern to Classic switch: passed','Classic toolbar/tab view: passed','Classic to Modern switch: passed','Modern page session save: passed') | Set-Content 'desktop\BUILD_DESKTOP_V1.11.21_AND_V2.1_UI_SMOKE_SUCCESS.txt'
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          Remove-Item 'desktop\BUILD_DESKTOP_V1.11.21_AND_V2.1_UI_SMOKE_FAILURE.txt' -Force -ErrorAction SilentlyContinue
          git add -f 'desktop/BUILD_DESKTOP_V1.11.21_AND_V2.1_UI_SMOKE_SUCCESS.txt'
          git add -u 'desktop/BUILD_DESKTOP_V1.11.21_AND_V2.1_UI_SMOKE_FAILURE.txt' 2>$null
          git rm '.github/workflows/validate-v11121-v21-ui-smoke-scheduled.yml'
          if(Test-Path '.github/workflows/validate-v11121-v21-ui-smoke-diagnostic.yml'){git rm '.github/workflows/validate-v11121-v21-ui-smoke-diagnostic.yml'}
          git commit -m 'Verify v1.11.21 and v2.1 Modern Classic UI smoke [skip ci]'
          git push origin main
