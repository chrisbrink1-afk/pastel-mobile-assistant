name: Rebuild Pastel Payment Assistant v1.11.17 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-v11117-portable.yml'
      - 'desktop/v1.11.17_blank_details_identity_transform.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: pastel-v11117-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and test v1.11.17 source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/v1.11-allocation-controls
          git show origin/feature/v1.11-allocation-controls:desktop/v1.11_final.pyw | Out-File -FilePath 'desktop\v1.11.17_release.pyw' -Encoding utf8
          python 'desktop\v1.11.1_strict_match_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.1 transform failed'}
          python 'desktop\v1.11.2_global_match_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.2 transform failed'}
          python 'desktop\v1.11.3_amount_description_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.3 transform failed'}
          python 'desktop\v1.11.4_amount_review_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.4 transform failed'}
          python 'desktop\v1.11.5_sequential_reference_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.5 transform failed'}
          python 'desktop\v1.11.6_profiles_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.6 transform failed'}
          python 'desktop\v1.11.7_multi_review_assignment_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.7 transform failed'}
          python 'desktop\v1.11.8_pre_remove_main_review_method.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.8 pre-transform failed'}
          python 'desktop\v1.11.8_rule_dialog_review_table_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.8 transform failed'}
          python 'desktop\v1.11.9_visible_rule_assignment_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.9 transform failed'}
          python 'desktop\v1.11.10_resizable_rule_dialog_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.10 transform failed'}
          python 'desktop\v1.11.11_scrollable_rule_dialog_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.11 transform failed'}
          python 'desktop\v1.11.12_rule_edits_stay_auto_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.12 transform failed'}
          python 'desktop\v1.11.13_select_manual_allocations_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.13 transform failed'}
          python 'desktop\v1.11.14_additive_allocation_selection_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.14 transform failed'}
          python 'desktop\v1.11.15_user_friendly_help_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.15 transform failed'}
          python 'desktop\v1.11.16_recurring_identity_apply_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.16 transform failed'}
          python 'desktop\v1.11.17_blank_details_identity_transform.py' 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'v1.11.17 transform failed'}
          python -m py_compile 'desktop\v1.11.17_release.pyw'; if($LASTEXITCODE -ne 0){throw 'compile failed'}
          python 'desktop\v1.11.17_release.pyw' --self-test; if($LASTEXITCODE -ne 0){throw 'self-test failed'}
          $src=Get-Content 'desktop\v1.11.17_release.pyw' -Raw
          if(!$src.Contains('APP_VERSION = "1.11.17"')){throw 'Version marker missing'}
          if(!$src.Contains('blank bank-description/reference fallback')){throw 'Blank-detail fallback marker missing'}
          if(!$src.Contains('canonical and p == canonical')){throw 'Exact canonical blank-detail guard missing'}
          if(!$src.Contains('def apply_saved_recurring_identity_rule')){throw 'Recurring identity direct-apply helper missing'}
          if(!$src.Contains('Existing manual selections were preserved')){throw 'Additive auto-selection behavior missing'}
          if(!$src.Contains('Existing automatic selections were preserved')){throw 'Additive manual-selection behavior missing'}
          if(!$src.Contains('class HoverHelp')){throw 'Hover help missing'}
          if(!$src.Contains('Quick select for export')){throw 'Grouped recurring UI missing'}
          if(!$src.Contains('self.resizable(True, True)')){throw 'Resizable RuleDialog missing'}
          if(!$src.Contains('self.rule_vscroll') -or !$src.Contains('self.rule_hscroll')){throw 'RuleDialog scrolling missing'}
          if(!$src.Contains('amount_review_assign_button')){throw 'Assign selected control missing'}
          if(!$src.Contains('Company profile:')){throw 'Profiles missing'}
          if(!$src.Contains('assign_monthly_sequential_references')){throw 'Sequential refs missing'}
          if(!$src.Contains('GLOBAL SAFETY GATE')){throw 'Strict matching missing'}

      - name: Build portable Windows app
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pyinstaller
          if($LASTEXITCODE -ne 0){throw 'PyInstaller install failed'}
          Remove-Item 'desktop\v11117rebuild' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'desktop\v11117rebuild' | Out-Null
          Copy-Item 'desktop\v1.11.17_release.pyw' 'desktop\v11117rebuild\pastel_payment_assistant.pyw' -Force
          Push-Location 'desktop\v11117rebuild'
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.11.17" pastel_payment_assistant.pyw
          $buildCode=$LASTEXITCODE
          Pop-Location
          if($buildCode -ne 0){throw 'PyInstaller build failed'}
          $app='desktop\v11117rebuild\dist\Pastel Payment Assistant v1.11.17'
          if(!(Test-Path $app)){throw 'Portable app folder missing'}
          Copy-Item $app 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.11.17 - Portable Windows',
            '',
            'No Python installation is required.',
            'Keep this entire folder together.',
            'Run: Pastel Payment Assistant v1.11.17.exe',
            '',
            'v1.11.17 blank-description recurring fix:',
            '- Standard Bank rows with a blank description/reference can use their transaction type as the recurring identity only when it exactly equals the saved canonical rule pattern.',
            '- STOP ORDER HANDLING FEE with blank details therefore applies its saved identity rule automatically when a CSV is loaded.',
            '- Generic/partial blank-detail patterns are rejected; strict matching remains in place for normal transactions.',
            '- Recurring child rows continue to inherit saved GL/VAT/description immediately after editing a rule.',
            '- Auto and Manual quick-select actions remain additive.',
            '- Grouped controls, hover ? help, profiles, amount review and resizable/scrollable Rule windows remain available.'
          ) | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable\README.txt'
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable.zip' -Force -ErrorAction SilentlyContinue
          Compress-Archive 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable' 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable.zip' -Force
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" | Set-Content 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable.sha256.txt'
          if((Get-Item 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable.zip').Length -ge 100MB){throw 'Portable ZIP too large'}

      - name: Publish successful package and stop retries
        id: commit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $hash=(Get-FileHash 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.11.17 portable package succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $hash",
            'Packaging: PyInstaller --onedir --windowed',
            'Blank-description STOP ORDER HANDLING FEE automatic match check: passed',
            'Blank-detail exact-canonical safety checks: passed',
            'Partial/generic blank-detail match rejection checks: passed',
            'Recurring identity child allocation checks: passed',
            'Auto and Manual additive selection checks: passed',
            'Grouped UI and hover help checks: passed',
            'Resizable and scrollable Rule dialog checks: passed',
            'Company profile isolation tests: passed',
            'Monthly sequential reference tests: passed',
            'Global strict identity matching tests: passed'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.17_BLANK_DETAILS_SUCCESS.txt'
          Remove-Item 'desktop\BUILD_DESKTOP_V1.11.17_BLANK_DETAILS_FAILURE.txt' -Force -ErrorAction SilentlyContinue
          Remove-Item 'desktop\v11117rebuild' -Recurse -Force
          Remove-Item 'desktop\Pastel-Payment-Assistant-v1.11.17-Portable' -Recurse -Force
          Remove-Item 'desktop\v1.11.17_release.pyw' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'desktop/Pastel-Payment-Assistant-v1.11.17-Portable.zip' 'desktop/Pastel-Payment-Assistant-v1.11.17-Portable.sha256.txt' 'desktop/BUILD_DESKTOP_V1.11.17_BLANK_DETAILS_SUCCESS.txt'
          git rm '.github/workflows/rebuild-v11117-portable.yml'
          git commit -m 'Publish Pastel Payment Assistant v1.11.17 portable [skip ci]'
          git push

      - name: Record failure
        if: failure()
        shell: powershell
        run: |
          @(
            'Pastel Payment Assistant v1.11.17 package failed.',
            "run=${{ github.run_id }} attempt=${{ github.run_attempt }}",
            'source=${{ steps.source.outcome }}',
            'build=${{ steps.build.outcome }}',
            'commit=${{ steps.commit.outcome }}'
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.11.17_BLANK_DETAILS_FAILURE.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'desktop/BUILD_DESKTOP_V1.11.17_BLANK_DETAILS_FAILURE.txt'
          git commit -m 'Record v1.11.17 package failure [skip ci]'
          if($LASTEXITCODE -eq 0){git push}
