name: Build Windows Desktop Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/v1.9_parts/**'
      - '.github/workflows/build-desktop-exe.yml'

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify v1.9 source ZIP
        shell: powershell
        run: |
          $parts = Get-ChildItem 'desktop\v1.9_parts\part*.b64' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 source chunks, found $($parts.Count)" }
          $builder = New-Object System.Text.StringBuilder
          foreach ($part in $parts) {
            [void]$builder.Append((Get-Content $part.FullName -Raw).Trim())
          }
          $bytes = [Convert]::FromBase64String($builder.ToString())
          [IO.File]::WriteAllBytes('desktop\Pastel_Payment_Assistant_v1.9.zip', $bytes)
          $hash = (Get-FileHash 'desktop\Pastel_Payment_Assistant_v1.9.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '1a34c916a907ab17d274a498118736a70a6f08764be31893e545e707edf501d7') {
            throw "Source ZIP SHA-256 mismatch: $hash"
          }
          if ((Get-Item 'desktop\Pastel_Payment_Assistant_v1.9.zip').Length -ne 32599) {
            throw "Source ZIP size mismatch"
          }

      - name: Extract v1.9 source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop\build' | Out-Null
          Expand-Archive -Path 'desktop\Pastel_Payment_Assistant_v1.9.zip' -DestinationPath 'desktop\build' -Force

      - name: Validate Python source
        shell: powershell
        working-directory: desktop\build\Pastel_Payment_Assistant_v1.9
        run: python -m py_compile pastel_payment_assistant.pyw

      - name: Install PyInstaller
        shell: powershell
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable Windows folder
        shell: powershell
        working-directory: desktop\build\Pastel_Payment_Assistant_v1.9
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Pastel Payment Assistant v1.9" pastel_payment_assistant.pyw

      - name: Package portable build
        shell: powershell
        run: |
          $src = 'desktop\build\Pastel_Payment_Assistant_v1.9\dist\Pastel Payment Assistant v1.9'
          if (!(Test-Path $src)) { throw 'Portable application folder was not created' }
          Copy-Item $src 'Pastel-Payment-Assistant-v1.9-Portable' -Recurse
          @(
            'Pastel Payment Assistant v1.9 - Portable Windows build',
            '',
            'No Python installation is required.',
            'Keep all files in this folder together.',
            'Run: Pastel Payment Assistant v1.9.exe',
            '',
            'This folder-based build does not use PyInstaller one-file self-extraction.',
            'If corporate endpoint security still blocks it, please ask your IT/security administrator to review/allow the application rather than disabling security controls.'
          ) | Set-Content 'Pastel-Payment-Assistant-v1.9-Portable\README.txt'
          Compress-Archive -Path 'Pastel-Payment-Assistant-v1.9-Portable' -DestinationPath 'Pastel-Payment-Assistant-v1.9-Portable.zip' -Force
          $zipHash = (Get-FileHash 'Pastel-Payment-Assistant-v1.9-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$zipHash" | Set-Content 'Pastel-Payment-Assistant-v1.9-Portable.sha256.txt'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pastel-Payment-Assistant-v1.9-Portable-Windows
          path: |
            Pastel-Payment-Assistant-v1.9-Portable.zip
            Pastel-Payment-Assistant-v1.9-Portable.sha256.txt

      - name: Publish portable Windows release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-v1.9-portable --cleanup-tag -y || true
          gh release create desktop-v1.9-portable \
            Pastel-Payment-Assistant-v1.9-Portable.zip \
            Pastel-Payment-Assistant-v1.9-Portable.sha256.txt \
            --title "Pastel Payment Assistant v1.9 - Portable Windows" \
            --notes "Folder-based portable Windows build. No Python installation required. This avoids PyInstaller one-file self-extraction. If corporate endpoint security still blocks it, ask your IT/security administrator to review or allow the application; do not disable security controls."

      - name: Mark successful portable build
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $zipHash = (Get-FileHash 'Pastel-Payment-Assistant-v1.9-Portable.zip' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.9 portable Windows build succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "Portable ZIP SHA256: $zipHash"
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.9_PORTABLE_SUCCESS.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.9_PORTABLE_SUCCESS.txt'
          git commit -m 'Mark v1.9 portable build successful [skip ci]'
          git push
