name: Build Windows Desktop EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/v1.9_parts/**'
      - '.github/workflows/build-desktop-exe.yml'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify v1.9 source ZIP
        shell: powershell
        run: |
          $parts = Get-ChildItem 'desktop\v1.9_parts\part*.b64' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 source chunks, found $($parts.Count)" }
          $builder = New-Object System.Text.StringBuilder
          foreach ($part in $parts) {
            [void]$builder.Append((Get-Content $part.FullName -Raw).Trim())
          }
          $bytes = [Convert]::FromBase64String($builder.ToString())
          [IO.File]::WriteAllBytes('desktop\Pastel_Payment_Assistant_v1.9.zip', $bytes)
          $hash = (Get-FileHash 'desktop\Pastel_Payment_Assistant_v1.9.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '1a34c916a907ab17d274a498118736a70a6f08764be31893e545e707edf501d7') {
            throw "Source ZIP SHA-256 mismatch: $hash"
          }
          if ((Get-Item 'desktop\Pastel_Payment_Assistant_v1.9.zip').Length -ne 32599) {
            throw "Source ZIP size mismatch"
          }

      - name: Extract v1.9 source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop\build' | Out-Null
          Expand-Archive -Path 'desktop\Pastel_Payment_Assistant_v1.9.zip' -DestinationPath 'desktop\build' -Force

      - name: Validate Python source
        shell: powershell
        working-directory: desktop\build\Pastel_Payment_Assistant_v1.9
        run: python -m py_compile pastel_payment_assistant.pyw

      - name: Install PyInstaller
        shell: powershell
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone Windows EXE
        shell: powershell
        working-directory: desktop\build\Pastel_Payment_Assistant_v1.9
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Pastel Payment Assistant v1.9" pastel_payment_assistant.pyw

      - name: Prepare EXE
        shell: powershell
        run: |
          Copy-Item 'desktop\build\Pastel_Payment_Assistant_v1.9\dist\Pastel Payment Assistant v1.9.exe' 'Pastel-Payment-Assistant-v1.9.exe'
          if (!(Test-Path 'Pastel-Payment-Assistant-v1.9.exe')) { throw 'EXE was not created' }
          $exeHash = (Get-FileHash 'Pastel-Payment-Assistant-v1.9.exe' -Algorithm SHA256).Hash.ToLower()
          "SHA256=$exeHash" | Set-Content 'Pastel-Payment-Assistant-v1.9.sha256.txt'

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pastel-Payment-Assistant-v1.9-Windows
          path: |
            Pastel-Payment-Assistant-v1.9.exe
            Pastel-Payment-Assistant-v1.9.sha256.txt

      - name: Publish Windows EXE release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-v1.9 --cleanup-tag -y || true
          gh release create desktop-v1.9 \
            Pastel-Payment-Assistant-v1.9.exe \
            Pastel-Payment-Assistant-v1.9.sha256.txt \
            --title "Pastel Payment Assistant v1.9 - Windows" \
            --notes "Standalone Windows build. No Python installation required. Review all Sage Pastel import files before Update/Process."

      - name: Mark successful desktop build
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $exeHash = (Get-FileHash 'Pastel-Payment-Assistant-v1.9.exe' -Algorithm SHA256).Hash.ToLower()
          @(
            'Pastel Payment Assistant v1.9 Windows EXE build succeeded.',
            "Source commit: $env:GITHUB_SHA",
            "EXE SHA256: $exeHash"
          ) | Set-Content 'desktop\BUILD_DESKTOP_V1.9_SUCCESS.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'desktop/BUILD_DESKTOP_V1.9_SUCCESS.txt'
          git commit -m 'Mark v1.9 Windows EXE build successful [skip ci]'
          git push
