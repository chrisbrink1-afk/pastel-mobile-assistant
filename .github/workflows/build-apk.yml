name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: unzip -q Pastel_Mobile_Assistant_Android_v0.1.zip

      - name: Fix Kotlin dependency conflict
        run: |
          cat >> Pastel_Mobile_Assistant_Android_v0.1/app/build.gradle <<'EOF'

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          EOF

      - name: Build debug APK
        working-directory: Pastel_Mobile_Assistant_Android_v0.1
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: cp Pastel_Mobile_Assistant_Android_v0.1/app/build/outputs/apk/debug/app-debug.apk Pastel-Mobile-Assistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pastel-Mobile-Assistant-APK
          path: Pastel-Mobile-Assistant.apk

      - name: Publish stable APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-latest --cleanup-tag -y || true
          gh release create mobile-latest Pastel-Mobile-Assistant.apk \
            --title "Pastel Mobile Assistant v0.3" \
            --notes "Android test build with Standard Bank headerless CSV support. Review all generated Sage Pastel import files before Update/Process."
