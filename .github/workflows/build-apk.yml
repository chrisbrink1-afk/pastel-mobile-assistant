name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: unzip -q Pastel_Mobile_Assistant_Android_v0.1.zip

      - name: Add Standard Bank headerless CSV support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Pastel_Mobile_Assistant_Android_v0.1/app/src/main/java/za/co/pastelassistant/mobile/MainActivity.java')
          s = p.read_text()

          old = '''        if (lines.isEmpty()) throw new IOException("CSV is empty");

        int headerLine = findHeaderLine(lines);
        List<String> header = parseCsvLine(lines.get(headerLine));
'''
          new = '''        if (lines.isEmpty()) throw new IOException("CSV is empty");

        // Standard Bank transaction-history exports are commonly headerless and use:
        // HIST,date,flag,amount,transaction type,description/reference,code,balance/flag
        if (looksLikeStandardBankHistory(lines)) {
            parseStandardBankHistory(lines);
            return;
        }

        int headerLine = findHeaderLine(lines);
        List<String> header = parseCsvLine(lines.get(headerLine));
'''
          if old not in s:
              raise SystemExit('Could not find parseBankCsv insertion point')
          s = s.replace(old, new, 1)

          anchor = '''    private int findHeaderLine(List<String> lines) {
'''
          methods = r'''    private boolean looksLikeStandardBankHistory(List<String> lines) {
        int matches = 0;
        int max = Math.min(lines.size(), 40);
        for (int i = 0; i < max; i++) {
            List<String> row = parseCsvLine(lines.get(i));
            if (row.size() >= 6 && "HIST".equalsIgnoreCase(safe(row, 0).trim())) {
                String date = safe(row, 1).trim();
                String amount = safe(row, 3).trim();
                if (date.matches("\\d{8}") && !amount.isEmpty()) {
                    matches++;
                    if (matches >= 2) return true;
                }
            }
        }
        return false;
    }

    private void parseStandardBankHistory(List<String> lines) throws IOException {
        ArrayList<BankTxn> parsed = new ArrayList<>();
        for (String line : lines) {
            List<String> row = parseCsvLine(line);
            if (row.size() < 6 || !"HIST".equalsIgnoreCase(safe(row, 0).trim())) continue;

            String date = safe(row, 1).trim();
            double rawAmount = parseMoney(safe(row, 3));
            if (rawAmount >= -0.00001) continue;

            String txnType = safe(row, 4).trim();
            String reference = safe(row, 5).trim();
            String description = reference.isEmpty() ? txnType : reference;
            if (description.isEmpty()) continue;

            double amount = Math.abs(rawAmount);
            parsed.add(new BankTxn(date, description, amount, recurringKey(description)));
        }

        if (parsed.isEmpty()) {
            throw new IOException("Standard Bank CSV detected, but no outgoing HIST payment rows were found");
        }

        synchronized (bankTransactions) {
            bankTransactions.clear();
            bankTransactions.addAll(parsed);
            repeatGroups.clear();
            for (BankTxn t : parsed) {
                repeatGroups.computeIfAbsent(t.key, k -> new ArrayList<>()).add(t);
            }
            repeatGroups.entrySet().removeIf(e -> e.getValue().size() < 2 && !hasRule(e.getKey()));
        }
    }

'''
          if anchor not in s:
              raise SystemExit('Could not find findHeaderLine insertion point')
          s = s.replace(anchor, methods + anchor, 1)

          # Give this patched build a distinct version number.
          gradle = Path('Pastel_Mobile_Assistant_Android_v0.1/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('versionCode 2', 'versionCode 3')
          g = g.replace("versionName '0.2'", "versionName '0.3'")
          gradle.write_text(g)

          p.write_text(s)
          PY

      - name: Fix Kotlin dependency conflict
        run: |
          cat >> Pastel_Mobile_Assistant_Android_v0.1/app/build.gradle <<'EOF'

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          EOF

      - name: Build debug APK
        working-directory: Pastel_Mobile_Assistant_Android_v0.1
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: cp Pastel_Mobile_Assistant_Android_v0.1/app/build/outputs/apk/debug/app-debug.apk Pastel-Mobile-Assistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pastel-Mobile-Assistant-APK
          path: Pastel-Mobile-Assistant.apk

      - name: Publish stable APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-latest --cleanup-tag -y || true
          gh release create mobile-latest Pastel-Mobile-Assistant.apk \
            --title "Pastel Mobile Assistant" \
            --notes "Android test build with Standard Bank headerless CSV support. Review all generated Sage Pastel import files before Update/Process."
